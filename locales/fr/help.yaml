  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.

  Après RaidUnit8, la liste reprend au début.
HarassingSiegeEngine1: >-
  Engin de harcèlement n° 1. Il rejoint le château ennemi depuis la guilde des ingénieurs en tirant sur les
  bâtiments en chemin ; les balistes incendiaires visent aussi les unités.
HarassingSiegeEngine2: >-
  Engin de harcèlement n° 2. Il rejoint le château ennemi depuis la guilde des ingénieurs en tirant sur les
  bâtiments en chemin ; les balistes incendiaires visent aussi les unités.
HarassingSiegeEngine3: >-
  Engin de harcèlement n° 3. Il rejoint le château ennemi depuis la guilde des ingénieurs en tirant sur les
