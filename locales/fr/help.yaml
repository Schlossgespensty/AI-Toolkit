  bâtiments en chemin ; les balistes incendiaires visent aussi les unités.


  Après HarassingSiegeEngine8, la liste reprend au début.
HarassingSiegeEnginesMax: Nombre maximal d'engins de harcèlement présents simultanément.
RaidRetargetDelay: Délai des troupes de raid avant de viser un nouveau bâtiment.
AttForceBase: >-
  Nombre d'unités d'attaque recrutées avant d'attaquer. Augmente à chaque attaque selon le réglage UCP, de 5
  en vanilla.
AttForceRandom: Effectif pouvant s'ajouter à AttForceBase si l'IA se sent forte et possède beaucoup d'or.
AttForceSupportAllyThreshold: Nombre d'unités d'attaque nécessaires avant que l'IA exécute les ordres d'attaque ou d'aide du joueur.
AttForceRallyPercentage: Pourcentage d'unités devant atteindre le point de ralliement avant le début de l'attaque.
Unknown129: >-
  Impact presque nul. Pourcentage d'unités devant atteindre le ralliement avant le repli si l'attaque est
  jugée trop faible.


  Également le pourcentage de ces unités devant revenir au donjon avant le recrutement de la prochaine
  attaque.
AttAssaultDelay: Temps d'attente des unités et engins au ralliement après le début de l'attaque avant leur envoi au combat.
AttUnitPatrolRecommandDelay: |-
  Délai avant le retour après une attaque réussie.

  Normalement 0 : l'IA n'a aucune raison d'attendre sur la tombe adverse.
Unknown132: >-
  Probabilité en % d'attendre l'attaque d'un allié. Plus tard, peut aussi déclencher une attaque avant le
  recrutement complet pour rejoindre un allié qui attaque.
SiegeEngine1: Engin de siège n° 1 recruté pour les attaques.
SiegeEngine2: Engin de siège n° 2 recruté pour les attaques.
SiegeEngine3: Engin de siège n° 3 recruté pour les attaques.
SiegeEngine4: Engin de siège n° 4 recruté pour les attaques.
SiegeEngine5: Engin de siège n° 5 recruté pour les attaques.
SiegeEngine6: Engin de siège n° 6 recruté pour les attaques.
SiegeEngine7: Engin de siège n° 7 recruté pour les attaques.
SiegeEngine8: Engin de siège n° 8 recruté pour les attaques. Huit engins de siège d'attaque au maximum sont possibles.
CowThrowInterval: Nombre de pierres lancées par une catapulte avant de lancer une vache.
AttMaxEngineers: >-
  Nombre maximal d'ingénieurs affectés aux emplacements SiegeEngine. Il doit au moins couvrir les besoins
  cumulés des engins.
AttDiggingUnit: Unité comblant les douves ennemies pendant une attaque.
AttDiggingUnitMax: Nombre maximal d'unités de creusement recrutées par attaque.
AttUnitVanguard: Unité qui fonce vers le château ennemi avant toutes les autres.
AttUnitVanguardMax: Nombre maximal d'unités d'avant-garde recrutées par attaque.
AttMaxAssassins: Nombre maximal d'assassins escaladant les corps de garde ennemis pendant un siège.
AttMaxLaddermen: Nombre maximal de porte-échelles plaçant leurs échelles contre les murs pendant un siège.
AttMaxTunnelers: Nombre maximal de tunneliers creusant vers le donjon ennemi.
AttUnitPatrol: Unités patrouillant autour du château ennemi et tirant sur ses unités.
AttUnitPatrolMax: Nombre maximal d'unités de patrouille recrutées par attaque.
AttUnitPatrolGroupsCount: Nombre de groupes formés par les patrouilles au début de l'attaque.
AttUnitBackup: >-
  Unités restant au ralliement et attaquant seulement si un chemin vers le donjon ennemi existe. Elles se
  replient si tous les autres attaquants meurent.
AttUnitBackupMax: Nombre maximal d'unités de réserve recrutées par attaque.
AttUnitBackupGroupsCount: Nombre de groupes de réserve lors de l'attaque du donjon ennemi.
AttUnitEngage: Unités attaquant les unités et paysans ennemis plutôt que les murs.
AttUnitEngageMax: Nombre maximal d'unités d'interception recrutées par attaque.
AttUnitSiegeDef: >-
  La protection du siège reste près des engins durant l'attaque, y compris parfois les engins de harcèlement
  et de défense.
AttUnitSiegeDefMax: Nombre maximal d'unités de protection du siège recrutées par attaque.
AttUnitSiegeDefGroupsCount: Nombre de groupes de protection du siège pendant l'attaque.
AttUnitMain1: |-
  Unité n° 1 du groupe d'assaut principal. Seules ces unités augmentent sans limite.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
AttUnitMain2: |-
  Unité n° 2 du groupe d'assaut principal. Seules ces unités augmentent sans limite.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
AttUnitMain3: |-
  Unité n° 3 du groupe d'assaut principal. Seules ces unités augmentent sans limite.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
AttUnitMain4: |-
  Unité n° 4 du groupe d'assaut principal. Seules ces unités augmentent sans limite.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.

  Après AttUnitMain4, la liste reprend au début.
AttMaxDefault: >-
  Nombre d'unités principales pouvant être recrutées avant de compléter TOUS les spécialistes (AttLaddermen,
  AttAssassins, AttUnitPatrol, etc.).

  À 0, tous les spécialistes doivent être recrutés avant toute unité AttUnitMain.
AttMainGroupsCount: Nombre de groupes formés par les unités AttUnitMain pendant l'attaque.
TargetChoice: |-
  Définit le choix de la cible.

  Or : ennemi possédant le plus d'or.

  Équilibré : score calculé de faiblesse, choix le plus complexe et nuancé.

  Le plus proche : ennemi le plus proche, mesuré de donjon à donjon.

  N'importe lequel : prochain ennemi de la liste interne. Peut sembler aléatoire, mais suit un ordre fixe.

  Joueur : priorité aux humains. Sans ennemi humain, utilise « Le plus proche ».
AIOxTethers_DisableInitialOxTether: >-
  « Non » conserve le comportement vanilla. « Oui » empêche la construction automatique d'une attache à bœufs
  à chaque (re)construction de carrière.
AIOxTethers_Logic: |-
  Logique appliquée.
  Non = vanilla, Oui = dynamique.
AIOxTethers_MaxOxTethers: Le total d'attaches à bœufs de cette IA ne dépasse jamais cette valeur.
AIOxTethers_DynamicMaxOxTethers: Le total d'attaches à bœufs ne dépasse jamais cette valeur multipliée par le nombre de carrières.
AIOxTethers_MinimumOxTethersPerQuarry: Si moins de ce nombre d'attaches liées transportent la pierre d'une carrière, une autre y est construite.
AIOxTethers_MaximumOxTethersPerQuarry: Si le nombre d'attaches liées à une carrière dépasse cette valeur, aucune autre n'y est construite.
AIOxTethers_ThresholdStoneLoad: Si pierres / attaches liées dépasse cette valeur pour une carrière, une autre attache y est construite.
RunningUnits_Macemen: >-
  Avec « Oui », les massiers courent toujours, même dans un groupe plus lent. Avec « Non », leur vitesse suit
  l'unité la plus lente du groupe, comme en vanilla.
RunningUnits_Spearmen: >-
  Avec « Oui », les lanciers courent toujours, même dans un groupe plus lent. Avec « Non », leur vitesse suit
  l'unité la plus lente du groupe, comme en vanilla.
RunningUnits_Slingers: >-
  Avec « Oui », les frondeurs courent toujours, même dans un groupe plus lent. Avec « Non », leur vitesse suit
  l'unité la plus lente du groupe, comme en vanilla.
RunningUnits_Slaves: >-
  Avec « Oui », les esclaves courent toujours, même dans un groupe plus lent. Avec « Non », leur vitesse suit
  l'unité la plus lente du groupe, comme en vanilla.
AIVTroops_InitialRole: >-
  Affectation initiale des troupes de départ/scénario non affectées. Creuser exige la capacité réelle et des
  cases de douves ; sinon la défense est utilisée.


  Valeur commune à toutes les troupes prises en charge. Vanilla omet ce champ à l'enregistrement et utilise le
  prochain réglage commun/menu applicable. Exige aiv-troops-behaviour avec réglages des troupes et
  remplacements AIC activés. Redémarrez UCP et lancez une nouvelle partie après modification.
AIVTroops_Movement: >-
  Déplacement défensif entre emplacements AIV. La patrouille utilise DefWallPatrolGroups et
  DefWallPatrolRallyTime ; zéro groupe reste immobile.


