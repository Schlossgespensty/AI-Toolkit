StrengthMultiplier: |-
  Multiplie les points de vie du seigneur.
  Rat = 0,5
  Standard = 1
  Loup = 1,5
DotColour: |-
  Couleur des points indiquant la force du seigneur.
  Vanilla utilise le jaune pour les IA faibles et le bleu pour les fortes.
DotCount: |-
  Nombre de points indiquant la force du seigneur.
  Vanilla utilise un point par tranche de 0,1 du multiplicateur.
Type: Type de seigneur apparaissant dans le donjon.
ArabArcher: Nombre d'unités (Archer arabe) apparaissant près du donjon au début de la partie.
Slave: Nombre d'unités (Esclave) apparaissant près du donjon au début de la partie.
Slinger: Nombre d'unités (Frondeur) apparaissant près du donjon au début de la partie.
Assassin: Nombre d'unités (Assassin) apparaissant près du donjon au début de la partie.
HorseArcher: Nombre d'unités (Archer monté) apparaissant près du donjon au début de la partie.
ArabSwordsman: Nombre d'unités (Épéiste arabe) apparaissant près du donjon au début de la partie.
FireThrower: Nombre d'unités (Lanceur de feu) apparaissant près du donjon au début de la partie.
EuropArcher: Nombre d'unités (Archer européen) apparaissant près du donjon au début de la partie.
Spearman: Nombre d'unités (Lancier) apparaissant près du donjon au début de la partie.
Maceman: Nombre d'unités (Massier) apparaissant près du donjon au début de la partie.
Crossbowman: Nombre d'unités (Arbalétrier) apparaissant près du donjon au début de la partie.
Pikeman: Nombre d'unités (Piquier) apparaissant près du donjon au début de la partie.
Swordsman: Nombre d'unités (Épéiste) apparaissant près du donjon au début de la partie.
Knight: Nombre d'unités (Chevalier) apparaissant près du donjon au début de la partie.
Monk: Nombre d'unités (Moine) apparaissant près du donjon au début de la partie.
WallDecoration: |-
  Décoration du seigneur lors du placement de « flg » dans l'éditeur AIV.

  8 = huile enflammée déversée
  9 = flammes
  10 = petit drapeau
  11 = grand drapeau
  12 = drapeau moyen
  13 = drapeau croisé
  14 = braseros
  15 = crânes décoratifs
  21 = nuages de vapeur
  22 = nuages de maladie
  26 = explosions de feu
  28 = corbeaux descendant
  29 = pierres moyennes dans l'eau
  30 = petites pierres frappant des structures
  31 = petites pierres dans l'eau
  40 = message flottant de zéro or
  41 = message flottant de zéro popularité
  42 = message flottant vide
  43 = message flottant vide
Unknown001: Valeur inutilisée.
Unknown002: Valeur inutilisée.
Unknown003: Valeur inutilisée.
Unknown004: Valeur inutilisée.
Unknown005: Valeur inutilisée.
CriticalPopularity: |-
  Sous cette popularité, l'IA vend massivement des marchandises pour obtenir de l'or.

  10000 = 100 de popularité.
  5000 = 50 de popularité.
LowestPopularity: >-
  Sous cette popularité, l'IA réduit les impôts vers TaxesMin et donne des rations supplémentaires jusqu'à
  HighestPopularity.


  10000 = 100 de popularité.

  5000 = 50 de popularité.
HighestPopularity: >-
  Au-dessus de cette popularité, l'IA augmente les impôts jusqu'à un modificateur de popularité stable allant
  jusqu'à −3.


  10000 = 100 de popularité.

  5000 = 50 de popularité.
TaxesMin: |-
  Niveau d'impôt minimal autorisé.
  0 = subventions maximales
  11 = impôts maximaux
TaxesMax: |-
  Niveau d'impôt maximal autorisé.
  0 = subventions maximales
  11 = impôts maximaux
Unknown011: Valeur inutilisée.
Farm1: |-
  Ferme n° 1 construite par l'IA.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
Farm2: |-
  Ferme n° 2 construite par l'IA.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
Farm3: |-
  Ferme n° 3 construite par l'IA.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
Farm4: |-
  Ferme n° 4 construite par l'IA.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
Farm5: |-
  Ferme n° 5 construite par l'IA.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
Farm6: |-
  Ferme n° 6 construite par l'IA.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
Farm7: |-
  Ferme n° 7 construite par l'IA.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
Farm8: |-
  Ferme n° 8 construite par l'IA. Après Farm8, la liste reprend au début.

  Les fermes détruites ne sont pas remplacées par le même type, mais par le suivant dans la liste.
PopulationPerFarm: >-
  L'IA construit une ferme par tranche de cette capacité de logement. La première est toujours construite à
  population 0.


  Les fermes de houblon ne comptent pas et sont construites dès que leur tour arrive.
PopulationPerWoodcutter: >-
  L'IA construit un bûcheron par tranche de cette capacité de logement. Au premier seuil atteint, elle en
  construit deux.
PopulationPerQuarry: >-
  L'IA construit une carrière par tranche de cette capacité de logement. Au premier seuil atteint, elle en
  construit deux.
PopulationPerIronmine: >-
  L'IA construit une mine de fer par tranche de cette capacité de logement. Au premier seuil atteint, elle en
  construit deux.
PopulationPerPitchrig: L'IA construit une fosse à poix par tranche de cette capacité de logement.
MaxQuarries: Nombre maximal de carrières construites par l'IA.
MaxIronmines: Nombre maximal de mines de fer construites par l'IA.
MaxWoodcutters: Nombre maximal de bûcherons construits par l'IA.
MaxPitchrigs: Nombre maximal de fosses à poix construites par l'IA.
MaxFarms: |-
  Nombre maximal de fermes construites par l'IA.

  Les fermes de houblon ne comptent pas.
BuildInterval: |-
  Vitesse de construction de l'IA. S'applique aux bâtiments AIV, hors AIV et à toutes les réparations.

  1 est la valeur la plus rapide.
ResourceRebuildDelay: Délai avant de tenter de reconstruire un bâtiment de ressources hors AIV.
MaxFood: |-
  Stock maximal de pommes, fromage, viande, pain et blé, plus ResourceVariance.

  La valeur s'applique à chaque type, PAS au total.
MinimumApples: |-
  Sous ce stock de pommes, l'IA achète [TradeAmountFood] pommes à la fois jusqu'à atteindre ce seuil.

  À 0, elle n'achète jamais de pommes.
MinimumCheese: |-
  Sous ce stock de fromage, l'IA achète [TradeAmountFood] fromages à la fois jusqu'à atteindre ce seuil.

  À 0, elle n'achète jamais de fromage.
MinimumBread: |-
  Sous ce stock de pain, l'IA achète [TradeAmountFood] pains à la fois jusqu'à atteindre ce seuil.

  À 0, elle n'achète jamais de pain.

  Avec une chaîne de boulangerie, 0 peut être préférable pour acheter du blé à la place.
MinimumWheat: |-
  Sous ce stock de blé, l'IA achète [TradeAmountFood] blés à la fois jusqu'à atteindre ce seuil.

  À 0, elle n'achète jamais de blé.
MinimumHop: >-
  Sous ce stock de houblon, l'IA achète [TradeAmountFood] houblons à la fois jusqu'à atteindre ce seuil. À 0,
  elle n'en achète jamais.
TradeAmountFood: >-
  Quantité de nourriture par achat. L'IA n'achète qu'un type à la fois.


  Une faible valeur rend chaque achat moins cher et plus probable, mais peut exiger plus d'achats :
  réapprovisionnement plus lent et pénuries brèves possibles.
TradeAmountEquipment: >-
  Quantité d'armes par achat. L'IA n'achète qu'un type d'équipement à la fois.


  Une faible valeur rend chaque achat moins cher et plus probable, mais peut exiger plus d'achats :
  réapprovisionnement plus lent et pénuries brèves possibles.
AIRequestDelay: Fréquence des demandes de ressources au joueur. Valeur plus basse → demandes plus fréquentes.
MinimumGoodsRequiredAfterTrade: Stock minimal d'une ressource devant rester à l'IA après un échange avec le joueur. Sinon, elle refuse.
DoubleRationsFoodThreshold: Lorsque le total de pommes, fromage, viande et pain dépasse cette valeur, l'IA donne des rations doubles.
MaxWood: Stock maximal de bois, plus ResourceVariance.
MaxStone: Stock maximal de pierre, plus ResourceVariance.
MaxResourceOther: |-
  Stock maximal de fer, poix, houblon et farine, plus ResourceVariance.

  S'applique à chaque type, pas au total.
MaxEquipment: Stock maximal d'armes et d'armures, plus ResourceVariance. S'applique à chaque type, pas au total.
MaxBeer: Stock maximal de bière, plus ResourceVariance.
MaxResourceVariance: Écart autorisé par rapport à chaque valeur « Max[Resource] ».
RecruitGoldThreshold: Or minimal requis avant que l'IA commence à recruter.
BlacksmithSetting: >-
  Définit la production des forges. Avec « Les deux », la première produit des épées, la deuxième des masses,
  la troisième des épées, etc.
FletcherSetting: >-
  Définit la production des archeries. Avec « Les deux », la première produit des arcs, la deuxième des
  arbalètes, la troisième des arcs, etc.
PoleturnerSetting: >-
  Définit la production des ateliers de lances. Avec « Les deux », le premier produit des lances, le deuxième
  des piques, le troisième des lances, etc.
SellResource01: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource02: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource03: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
