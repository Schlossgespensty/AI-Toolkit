Unknown142: Valeur inutilisée.
SortieUnitRangedMin: |-
  Nombre minimal d'unités envoyées pour une sortie à distance.

  Faible : presque jamais actif, surtout près de la défaite.
  Normal : surtout les premières années.
  Fort : le plus fréquent, souvent dès que population et effectif dépassent 40.
SortieUnitRanged: >-
  Type d'unité de sortie à distance. Ces unités se placent hors du château où des travailleurs sont morts.
  Leurs effectifs augmentent après des pertes répétées ; environ 25 unités de plus sont généralement recrutées
  plus tard.


  Le recrutement a lieu même à 0. Pour le désactiver, choisissez un type impossible à recruter.


  Les sorties ont toujours priorité sur tout autre recrutement.
SortieUnitMeleeMin: Nombre exact d'unités de sortie de mêlée envoyées.
SortieUnitMelee: >-
  Type d'unité de sortie interceptant les troupes qui détruisent des bâtiments. Elles reviennent au sommet du
  donjon après la mort de leur cible.


  Les sorties ont toujours priorité sur tout autre recrutement.
DefDiggingUnitMax: >-
  Nombre maximal d'unités de creusement recrutées. Tant que l'IA ou un allié prévoit des douves, elles ont
  priorité sur la défense, les raids et l'attaque.
DefDiggingUnit: Type d'unité creusant les douves de l'IA ou d'un allié.
RecruitInterval: >-
  Délai avant le prochain recrutement à l'état « Normal ». 1 est le plus rapide.


  Faible : presque jamais actif, surtout près de la défaite. Normal : surtout les premières années. Fort : le
  plus fréquent, souvent dès que population et effectif dépassent 40.
RecruitIntervalWeak: >-
  Délai avant le prochain recrutement à l'état « Faible ». 1 est le plus rapide.


  Faible : presque jamais actif, surtout près de la défaite. Normal : surtout les premières années. Fort : le
  plus fréquent, souvent dès que population et effectif dépassent 40.
RecruitIntervalStrong: >-
  Délai avant le prochain recrutement à l'état « Fort ». 1 est le plus rapide.


  Faible : presque jamais actif, surtout près de la défaite. Normal : surtout les premières années. Fort : le
  plus fréquent, souvent dès que population et effectif dépassent 40.
DefTotal: Nombre total d'unités défensives recrutées par l'IA.
OuterPatrolGroupsCount: Nombre de groupes défensifs patrouillant autour de l'économie.
OuterPatrolGroupsMove: >-
  Détermine si les défenseurs hors des murs patrouillent autour de l'économie ou restent immobiles, souvent
  près des carrières.
OuterPatrolRallyDelay: Délai d'attente des défenseurs hors des murs avant de rejoindre le prochain emplacement.
DefWalls: >-
  Nombre de défenseurs des murs pris dans l'effectif défensif total. Ils rejoignent leurs emplacements AIV ;
  les autres patrouillent l'économie.
DefUnit1: |-
  unité défensive n° 1 dans l'ordre de recrutement.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
DefUnit2: |-
  unité défensive n° 2 dans l'ordre de recrutement.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
DefUnit3: |-
  unité défensive n° 3 dans l'ordre de recrutement.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
DefUnit4: |-
