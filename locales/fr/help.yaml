DefUnit7: |-
  unité défensive n° 7 dans l'ordre de recrutement.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
DefUnit8: |-
  unité défensive n° 8 dans l'ordre de recrutement.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.

  Après DefUnit8, la liste reprend au début.
RaidUnitsBase: Nombre d'unités utilisées pour les raids contre les bâtiments adverses.
RaidUnitsRandom: Effectif pouvant s'ajouter à RaidUnitsBase si l'IA se sent forte et possède beaucoup d'or.
RaidUnit1: |-
  unité de raid n° 1 dans l'ordre de recrutement.

  Si l'IA ne peut pas financer un emplacement, elle essaie le suivant.
RaidUnit2: |-
