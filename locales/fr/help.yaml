SellResource09: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource10: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource11: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource12: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource13: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource14: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
SellResource15: Cette ressource est toujours vendue immédiatement par l'IA dès son obtention.
DefWallPatrolRallyTime: >-
  Temps d'attente des défenseurs des murs avant de rejoindre le prochain emplacement AIV. Tous ne peuvent pas
  patrouiller.
DefWallPatrolGroups: Nombre de groupes de défenseurs des murs patrouillant entre leurs emplacements AIV.
DefSiegeEngineGoldThreshold: Or requis pour construire des engins de siège AIV.
DefSiegeEngineBuildDelay: Délai avant de reconstruire des engins de siège AIV détruits. Valeur plus basse → délai plus court.
Unknown072: Valeur inutilisée.
Unknown073: Valeur inutilisée.
RecruitProbDefDefault: |-
  Probabilité de recruter des défenseurs à l'état « Normal ».

  Faible : presque jamais actif, surtout près de la défaite.
  Normal : surtout les premières années.
  Fort : le plus fréquent, souvent atteint dès que population et effectif dépassent 40.
RecruitProbDefWeak: |-
  Probabilité de recruter des défenseurs à l'état « Faible ».

  Faible : presque jamais actif, surtout près de la défaite.
  Normal : surtout les premières années.
  Fort : le plus fréquent, souvent atteint dès que population et effectif dépassent 40.
RecruitProbDefStrong: |-
  Probabilité de recruter des défenseurs à l'état « Fort ».

  Faible : presque jamais actif, surtout près de la défaite.
  Normal : surtout les premières années.
  Fort : le plus fréquent, souvent atteint dès que population et effectif dépassent 40.
RecruitProbRaidDefault: |-
  Probabilité de recruter des unités de raid à l'état « Normal ».

  Faible : presque jamais actif, surtout près de la défaite.
  Normal : surtout les premières années.
  Fort : le plus fréquent, souvent atteint dès que population et effectif dépassent 40.
RecruitProbRaidWeak: |-
