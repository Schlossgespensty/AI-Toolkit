RecruitProbAttackDefault: |-
  Probabilité de recruter des unités d'attaque à l'état « Normal ».

  Faible : presque jamais actif, surtout près de la défaite.
  Normal : surtout les premières années.
  Fort : le plus fréquent, souvent atteint dès que population et effectif dépassent 40.
RecruitProbAttackWeak: |-
