add_castle_message: |-
  Ajouter ce château à {{name}} ?
  « Ajouter à l’IA » le copie dans le dossier aiv de l’IA et garde le projet ouvert.
  « Modifier séparément » quitte le projet d’IA et permet d’enregistrer le château ailleurs.
new_castle_message: |-
  Créer un château dans {{name}} ?
  « Ajouter à l’IA » l’enregistre dans le dossier aiv de l’IA et garde le projet ouvert.
  « Modifier séparément » quitte le projet d’IA et permet d’enregistrer le château ailleurs.
replace_character_message: |-
  Utiliser ce personnage pour {{name}} ?
  « Ajouter à l’IA » remplace définitivement le fichier character.json actuel de l’IA.
  « Modifier séparément » quitte le projet d’IA et conserve son fichier de personnage actuel.
new_character_message: |-
  Créer un personnage pour {{name}} ?
  « Ajouter à l’IA » remplace définitivement le fichier character.json actuel de l’IA.
