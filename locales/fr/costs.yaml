reference_estimate_from_stronghold_heaven_original_stronghold_assuming_f: >-
  Estimation de référence de Stronghold Heaven (Stronghold original), avec personnel complet dès que les
  logements sont disponibles. Ces taux approximatifs ne sont pas des temps de simulation Crusader vérifiés.
  Sont exclus : retards de construction, pauses, pénuries, consommation, commerce, goulets de transport et
  effets de peur/repos. Ces marchandises ne représentent pas le stock de votre réserve.
