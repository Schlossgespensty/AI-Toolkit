work_ticks_exclude_the_return_journey_cycle_work_ticks_2_distance_walkin: >-
  Les ticks de travail excluent le retour : cycle = travail + 2 × distance × ticks de marche. Chaque
  producteur conserve sa progression et son bonus de livraison fractionnaire. La pierre correspond à la
  production de carrière ; le transport par bœufs n'est pas simulé. Les distances du calque de chemins sont
  des diagnostics de disposition distincts, pas des distances mesurées vers les ressources extérieures.
