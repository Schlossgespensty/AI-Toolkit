add_castle_message: |-
  Hozzáadod ezt a várat a(z) {{name}} projekthez?
  A „Hozzáadás az MI-hez” az MI aiv mappájába másolja a várat, és nyitva hagyja a projektet.
  A „Külön szerkesztés” kilép az MI-projektből, így a várat máshová mentheted.
new_castle_message: |-
  Új várat hozol létre a(z) {{name}} projektben?
  A „Hozzáadás az MI-hez” az MI aiv mappájába menti a várat, és nyitva hagyja a projektet.
  A „Külön szerkesztés” kilép az MI-projektből, így a várat máshová mentheted.
replace_character_message: |-
  Ezt a karaktert használod a(z) {{name}} projekthez?
  A „Hozzáadás az MI-hez” véglegesen felülírja az MI jelenlegi character.json fájlját.
  A „Külön szerkesztés” kilép az MI-projektből, és megtartja annak jelenlegi karakterfájlját.
new_character_message: |-
  Új karaktert hozol létre a(z) {{name}} projekthez?
  A „Hozzáadás az MI-hez” véglegesen felülírja az MI jelenlegi character.json fájlját.
  A „Külön szerkesztés” kilép az MI-projektből, és megtartja annak jelenlegi karakterfájlját.
add_document_message: >-
  Hozzáadja ezt a dokumentumot a(z) {{name}} projekthez? Új karakter hozzáadása felülírja a meglévő
  karakterfájlt.
