AttMaxDefault: >-
  Hány fősereg-egységet toborozhat az MI, mielőtt MINDEN különleges szerepet teljesen feltöltene
  (AttLaddermen, AttAssassins, AttUnitPatrol stb.). 0 esetén előbb minden különleges szerepet fel kell
  töltenie, és csak utána toborozhat AttUnitMain egységeket.
AttMainGroupsCount: Az AttUnitMain-egységek csoportjainak száma támadás közben.
TargetChoice: >-
  A támadás célpontválasztási módja.


  Arany: mindig a legtöbb arannyal rendelkező ellenséget támadja.


  Kiegyensúlyozott: számított gyengeségi pontszám alapján választ. Ez a legösszetettebb, legárnyaltabb mód.


  Legközelebbi: mindig az öregtornyok távolsága alapján legközelebbi ellenséget támadja.


  Bármelyik: a belső játékoslistán következő ellenséget támadja. Véletlenszerűnek tűnhet, de rögzített
  sorrendű.


  Játékos: először mindig emberi játékost céloz. Emberi ellenség hiányában a legközelebbit választja.
AIOxTethers_DisableInitialOxTether: "False: eredeti működés. True: ne építsen ökörkarámot minden kőfejtő építésekor vagy újjáépítésekor."
AIOxTethers_Logic: |-
  Az alkalmazott működési szabály.
  False: eredeti; True: dinamikus.
AIOxTethers_MaxOxTethers: Az MI ökörkarámjainak teljes száma sosem haladja meg ezt az értéket.
AIOxTethers_DynamicMaxOxTethers: Az MI ökörkarámjainak teljes száma sosem haladja meg ezt az értéket a kőfejtők számával megszorozva.
AIOxTethers_MinimumOxTethersPerQuarry: Ha ennél kevesebb kapcsolt ökörkarám szállít követ a kőfejtőből, új ökörkarám épül hozzá.
AIOxTethers_MaximumOxTethersPerQuarry: Ha a kőfejtőhöz kapcsolt ökörkarámok száma meghaladja ezt az értéket, nem épül hozzá újabb.
AIOxTethers_ThresholdStoneLoad: Ha a kőfejtő „kövek / kapcsolt ökörkarámok” aránya meghaladja ezt az értéket, újabb ökörkarám épül hozzá.
RunningUnits_Macemen: >-
  True esetén a(z) buzogányosok mindig futnak, lassabb egységekkel egy csoportban is. False esetén a csoport
  leglassabb egységéhez igazítják a sebességüket, mint az eredetiben.
RunningUnits_Spearmen: >-
