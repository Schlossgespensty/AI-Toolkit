HarassingSiegeEnginesMax: A pályán egyszerre jelen lévő zaklató ostromgépek legnagyobb száma.
RaidRetargetDelay: A portyázó csapatok várakozási ideje új célpontépület választása előtt.
AttForceBase: >-
  Az MI által támadás előtt toborzott egységek száma. Minden támadás után nő az UCP beállítása szerint; az
  eredetiben támadásonként 5-tel.
AttForceRandom: Hány egységet adhat az MI az AttForceBase létszámához, ha erősnek érzi magát és sok aranya van.
AttForceSupportAllyThreshold: Ennyi támadóegységet kell toborozni, mielőtt az MI végrehajtja a játékos Támadás/Segítség parancsát.
AttForceRallyPercentage: Az egységek hány százalékának kell a gyülekezőpontra érnie az MI támadása előtt.
Unknown129: >-
  Hatása közel nulla. Az egységek hány százalékának kell elérnie a gyülekezőpontot, mielőtt az MI visszavonul,
  ha a támadást túl gyengének ítéli a károkozáshoz.


  Egyben a visszavonulók azon százaléka, amelynek vissza kell érnie az öregtoronyhoz az új támadás toborzása
  előtt.
AttAssaultDelay: >-
  A támadó csapatok és ostromgépek várakozási ideje a gyülekezőponton a támadás megkezdése után, mielőtt
  harcba küldik őket.
AttUnitPatrolRecommandDelay: |-
  Az MI várakozási ideje sikeres támadás után, visszavonulás előtt.

  Általában 0 legyen, mert nincs oka az ellenfél sírjánál várakozni.
Unknown132: >-
  Annak százalékos esélye, hogy az MI megvárja a szövetséges támadását. Később azt is eredményezheti, hogy az
  MI a teljes támadósereg toborzása előtt csatlakozik a szövetséges támadásához.
SiegeEngine1: Az MI által támadáshoz toborzott 1. ostromgép.
SiegeEngine2: Az MI által támadáshoz toborzott 2. ostromgép.
SiegeEngine3: Az MI által támadáshoz toborzott 3. ostromgép.
SiegeEngine4: Az MI által támadáshoz toborzott 4. ostromgép.
