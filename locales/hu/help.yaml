SiegeEngine7: Az MI által támadáshoz toborzott 7. ostromgép.
SiegeEngine8: |-
  Az MI által támadáshoz toborzott 8. ostromgép.

  Legfeljebb nyolc támadó ostromgép lehet.
CowThrowInterval: Hány követ kell kilőnie a katapultnak, mielőtt helyette tehenet hajít.
Unknown142: Nem használt érték.
AttMaxEngineers: >-
  A SiegeEngine-helyek ostromgépeit kezelő mérnökök felső határa. Legalább annyi legyen, amennyit az összes
  ostromgép működtetése igényel.
AttDiggingUnit: Az ellenséges várárok betemetésére használt egység támadás közben.
AttDiggingUnitMax: Támadásonként toborzott ásóegységek felső határa.
AttUnitVanguard: Az az egység, amely mindenki más előtt rohan az ellenséges várra.
AttUnitVanguardMax: Támadásonként toborzott elővéd felső határa.
AttMaxAssassins: Az ostrom során ellenséges kapukra felmászó orgyilkosok felső határa.
AttMaxLaddermen: Az ostrom során falakhoz létrát állító létrások felső határa.
AttMaxTunnelers: Az ellenséges öregtorony felé alagutat ásó egységek felső határa.
AttUnitPatrol: Az ellenséges vár körül járőröző és ellenséges egységekre lövő csapatok.
AttUnitPatrolMax: Támadásonként toborzott járőregységek felső határa.
AttUnitPatrolGroupsCount: A járőregységek csoportjainak száma a támadás kezdetén.
AttUnitBackup: >-
  A gyülekezőponton maradó egységek, amelyek csak akkor támadnak, ha van út az ellenséges öregtoronyhoz. Ha a
  többi támadó meghal, visszavonulnak.
AttUnitBackupMax: Támadásonként toborzott tartalékegységek felső határa.
AttUnitBackupGroupsCount: A tartalékegységek csoportjainak száma az ellenséges öregtorony támadásakor.
AttUnitEngage: Azok az egységek, amelyek falak helyett ellenséges katonákat és parasztokat támadnak.
AttUnitEngageMax: Támadásonként toborzott harcba lépő egységek felső határa.
AttUnitSiegeDef: >-
  Az ostromgépvédők a támadás alatt az ostromgépeknél maradnak. Nemcsak támadó, hanem zaklató és védelmi
  ostromgépeket is kísérhetnek.
AttUnitSiegeDefMax: Támadásonként toborzott ostromgépvédők felső határa.
AttUnitSiegeDefGroupsCount: Az ostromgépvédők csoportjainak száma támadás közben.
