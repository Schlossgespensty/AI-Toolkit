AIVTroops_InitialRole: >-
  A még be nem osztott kezdő- vagy forgatókönyvbeli csapatok kezdeti szerepe. Az ásáshoz tényleges ásási
  képesség és várárokmezők kellenek; különben védelem lesz.


  Közös alapérték minden támogatott egységtípushoz. Az Eredeti érték kihagyja ezt a mezőt a mentett
  karakterből, és a következő alkalmazható közös vagy menübeli alapértéket használja. Az aiv-troops-behaviour
  bővítményben a Troop settings és Use AIC overrides legyen bekapcsolva. Módosítás után indítsa újra az UCP-t
  és kezdjen új mérkőzést.
