RaidRetargetDelay: Akın için başka bir binayı hedef seçmeden önce beklenecek süre.
AttForceBase: >-
  Bir saldırı başlatmak için gereken birim sayısı. Her saldırıdan sonra UCP ayarına göre artar; orijinal
  oyunda artış 5'tir.
AttForceRandom: Yapay zekâ kendini güçlü ve zengin gördüğünde AttForceBase üzerine eklenen birimler.
AttForceSupportAllyThreshold: Oyuncunun «Saldır» veya «Yardım et» komutlarını uygulamak için gereken saldırı askeri sayısı.
AttForceRallyPercentage: Saldırının başlaması için toplanma noktasına ulaşması gereken ordu yüzdesi.
Unknown129: >-
  Etkisi çok azdır: zayıf bir saldırı geri çekilmeden önce toplanma noktasına ulaşması gereken yüzde ve yeni
  saldırı için asker toplamadan önce iç kaleye ulaşması gereken geri çekilen asker yüzdesi.
AttAssaultDelay: Saldırı birimlerinin ve kuşatma makinelerinin hücuma ilerlemeden önce toplanma noktasında bekleyeceği süre.
AttUnitPatrolRecommandDelay: >-
  Kazanılan bir saldırıdan sonra geri çekilmeden önce beklenecek süre. Rakibin mezarında beklemeye gerek
  olmadığından genellikle 0'dır.
Unknown132: >-
  Müttefik saldırısını bekleme olasılığı, yüzde olarak. İlerleyen aşamalarda yapay zekâ, müttefik saldırısına
  katılmak için asker toplamayı tamamlamadan saldırabilir.
SiegeEngine1: Saldırı için toplanan 1. kuşatma makinesi.
SiegeEngine2: Saldırı için toplanan 2. kuşatma makinesi.
SiegeEngine3: Saldırı için toplanan 3. kuşatma makinesi.
SiegeEngine4: Saldırı için toplanan 4. kuşatma makinesi.
SiegeEngine5: Saldırı için toplanan 5. kuşatma makinesi.
SiegeEngine6: Saldırı için toplanan 6. kuşatma makinesi.
SiegeEngine7: Saldırı için toplanan 7. kuşatma makinesi.
SiegeEngine8: Saldırı için toplanan 8. kuşatma makinesi. En fazla sekiz makine toplanır.
CowThrowInterval: Bir mancınığın inek fırlatmadan önce fırlatacağı taş sayısı.
Unknown142: Kullanılmayan değer.
AttMaxEngineers: >-
  SiegeEngine yuvalarındaki kuşatma makinelerini kullanacak en fazla mühendis sayısı. En azından tüm bu
  makinelerin toplam mühendis ihtiyacını karşılamalıdır.
AttDiggingUnit: Saldırı sırasında düşman hendeğini dolduran birim türü.
AttDiggingUnitMax: Saldırı başına toplanan en fazla kazıcı sayısı.
AttUnitVanguard: Diğer birimlerden önce düşman kalesine saldırmak için koşan birim türü.
AttUnitVanguardMax: Saldırı başına toplanan en fazla öncü birim sayısı.
AttMaxAssassins: Kuşatma sırasında düşman kapı yapılarına tırmanmaya çalışan en fazla suikastçı sayısı.
AttMaxLaddermen: Kuşatma sırasında sura merdiven dayamaya çalışan en fazla merdivenci sayısı.
AttMaxTunnelers: Düşman iç kalesine doğru tünel kazmaya çalışan en fazla lağımcı sayısı.
AttUnitPatrol: Düşman kalesi çevresinde devriye gezip düşman askerlerine ateş eden birimler.
AttUnitPatrolMax: Saldırı başına toplanan en fazla devriye birimi sayısı.
AttUnitPatrolGroupsCount: Saldırı başladığında devriye birimlerinin ayrılacağı grup sayısı.
AttUnitBackup: >-
  Toplanma noktasında bekleyen ve yalnızca düşman iç kalesine yol varsa saldıran birimler. Diğer tüm
  saldırganlar ölürse geri çekilirler.
AttUnitBackupMax: Saldırı başına toplanan en fazla yedek birim sayısı.
AttUnitBackupGroupsCount: Düşman iç kalesine saldırırken yedek birimlerin ayrılacağı grup sayısı.
AttUnitEngage: Surlar yerine düşman askerlerine ve köylülerine saldırmaya çalışan birimler.
AttUnitEngageMax: Saldırı başına toplanan en fazla çatışma birimi sayısı.
AttUnitSiegeDef: >-
  Kuşatma koruma birimleri saldırı sırasında makinelerin yanında kalır. Saldırı makineleriyle birlikte taciz
  ve savunma makinelerini de koruyabilirler.
AttUnitSiegeDefMax: Saldırı başına toplanan en fazla kuşatma koruma birimi sayısı.
AttUnitSiegeDefGroupsCount: Saldırı sırasında kuşatma koruma birimlerinin ayrılacağı grup sayısı.
AttUnitMain1: >-
  Ana ordu asker toplama sırasındaki 1. yuva. Yalnızca bu birimlerin sayısı sınırsız artar. Yapay zekâ birimin
  maliyetini karşılayamazsa sonraki birimi toplamayı dener.
AttUnitMain2: >-
  Ana ordu asker toplama sırasındaki 2. yuva. Yalnızca bu birimlerin sayısı sınırsız artar. Yapay zekâ birimin
  maliyetini karşılayamazsa sonraki birimi toplamayı dener.
AttUnitMain3: >-
  Ana ordu asker toplama sırasındaki 3. yuva. Yalnızca bu birimlerin sayısı sınırsız artar. Yapay zekâ birimin
  maliyetini karşılayamazsa sonraki birimi toplamayı dener.
AttUnitMain4: >-
  Ana ordu asker toplama sırasındaki 4. yuva. Yalnızca bu birimlerin sayısı sınırsız artar. Yapay zekâ birimin
  maliyetini karşılayamazsa sonraki birimi toplamayı dener. AttUnitMain4 sonrasında sıra başa döner.
AttMaxDefault: >-
  Yapay zekânın tüm uzman rollerini (AttLaddermen, AttAssassins, AttUnitPatrol vb.) tamamlamak zorunda
  kalmadan önce toplayabileceği ana ordu birimi sayısı. 0 olduğunda herhangi bir AttUnitMain birimini
  toplamadan önce tüm uzman rollerini tamamlamalıdır.
AttMainGroupsCount: Saldırı sırasında AttUnitMain birimlerinin ayrılacağı grup sayısı.
TargetChoice: >-
  Yapay zekânın saldırı hedefini seçme yöntemi.


  Altın: en fazla altını olan düşmana saldırır.


  Dengeli: hesaplanan zayıflık puanına göre seçer; en ayrıntılı ve karmaşık yöntemdir.


  En yakın: iç kaleler arasındaki mesafeye göre en yakın düşmana saldırır.


  Herhangi biri: dahili oyuncu listesindeki sonraki düşmana saldırır. Rastgele görünebilir ancak sabit bir
  sıra izler.


  Oyuncu: önce insan oyuncuları hedefler. İnsan düşman yoksa «En yakın» yöntemini kullanır.
AIOxTethers_DisableInitialOxTether: >-
  False orijinal davranışı korur; True her taş ocağı kurulduğunda veya yeniden yapıldığında bir öküz bağı
  kurulmasını önler.
AIOxTethers_Logic: 'Uygulanan mantık: False orijinal, True dinamik mantığı kullanır.'
AIOxTethers_MaxOxTethers: Bu yapay zekânın toplam öküz bağı sayısı bu değeri aşmaz.
AIOxTethers_DynamicMaxOxTethers: Toplam öküz bağı sayısı, bu değerin taş ocağı sayısıyla çarpımını aşmaz.
AIOxTethers_MinimumOxTethersPerQuarry: Bu taş ocağından taş taşıyan bağlı öküz bağı sayısı bu değerden azsa ocak için yeni bir bağ kurulur.
AIOxTethers_MaximumOxTethersPerQuarry: Bir taş ocağına bağlı öküz bağı sayısı bu değeri aşarsa ocak için yeni bir bağ kurulmaz.
AIOxTethers_ThresholdStoneLoad: >-
  Bir taş ocağındaki taş miktarının bağlı öküz bağı sayısına bölümü bu değeri aşarsa ocak için yeni bir bağ
  kurulur.
RunningUnits_Macemen: >-
  Açıksa topuzcular, daha yavaş birimlerle aynı grupta olsalar bile daima koşar. Kapalıysa orijinal oyundaki
  gibi grubun en yavaş biriminin hızına uyarlar.
RunningUnits_Spearmen: >-
  Açıksa mızrakçılar, daha yavaş birimlerle aynı grupta olsalar bile daima koşar. Kapalıysa orijinal oyundaki
  gibi grubun en yavaş biriminin hızına uyarlar.
RunningUnits_Slingers: >-
  Açıksa sapancılar, daha yavaş birimlerle aynı grupta olsalar bile daima koşar. Kapalıysa orijinal oyundaki
  gibi grubun en yavaş biriminin hızına uyarlar.
RunningUnits_Slaves: >-
  Açıksa köleler, daha yavaş birimlerle aynı grupta olsalar bile daima koşar. Kapalıysa orijinal oyundaki gibi
  grubun en yavaş biriminin hızına uyarlar.
AIVTroops_InitialRole: >-
  Görevi olmayan başlangıç veya senaryo askerlerinin ilk görevi. Kazma için birimin kazabilmesi ve hendek
  karelerinin bulunması gerekir; aksi halde savunma görevi verilir.


  Desteklenen tüm askerler için ortak varsayılan değer. Vanilla seçeneği bu alanı karakter kaydına yazmaz ve
  geçerli sıradaki ortak veya menü varsayılanını kullanır. aiv-troops-behaviour eklentisinde «Asker ayarları»
  ve «AIC ayarlarını kullan» etkin olmalıdır. Değişikliklerden sonra UCP'yi yeniden başlatıp yeni oyun açın.
AIVTroops_Movement: >-
  AIV savunma noktaları arasındaki hareket. Devriye, DefWallPatrolGroups ve DefWallPatrolRallyTime değerlerini
  kullanır; grup sayısı sıfırsa askerler sabit kalır.


