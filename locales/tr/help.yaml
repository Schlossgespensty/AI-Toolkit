CriticalPopularity: >-
  Popülerlik bu değerin altındayken yapay zekâ altın kazanmak için kaynakları yoğun biçimde satar. 10000
  değeri 100 popülerliğe, 5000 değeri 50 popülerliğe karşılık gelir.
LowestPopularity: >-
  Popülerlik bu değerin altındayken yapay zekâ vergileri TaxesMin değerine indirir ve HighestPopularity
  değerine ulaşana kadar ek tayın verir. 10000 değeri 100 popülerliğe, 5000 değeri 50 popülerliğe karşılık
  gelir.
HighestPopularity: >-
  Bu popülerliğin üzerinde yapay zekâ, popülerlik değişimi en fazla −3 olacak şekilde dengelenene kadar
  vergileri artırır. 10000 değeri 100 popülerliğe, 5000 değeri 50 popülerliğe karşılık gelir.
TaxesMin: İzin verilen en düşük vergi düzeyi. 0 en yüksek bağışı, 11 en yüksek vergiyi belirtir.
TaxesMax: İzin verilen en yüksek vergi düzeyi. 0 en yüksek bağışı, 11 en yüksek vergiyi belirtir.
