PopulationPerFarm: >-
  Yapay zekâ, bu nüfus kapasitesi başına bir çiftlik kurar. İlk çiftlik kapasite 0 olsa bile kurulur. Şerbetçi
  otu çiftlikleri bu sınıra dahil değildir; çiftlik sırasında sıra kendilerine gelince kurulur.
PopulationPerWoodcutter: Yapay zekâ, bu nüfus kapasitesi başına bir oduncu kulübesi kurar. İlk eşiğe ulaşıldığında iki kulübe kurar.
PopulationPerQuarry: Yapay zekâ, bu nüfus kapasitesi başına bir taş ocağı kurar. İlk eşiğe ulaşıldığında iki taş ocağı kurar.
PopulationPerIronmine: Yapay zekâ, bu nüfus kapasitesi başına bir demir madeni kurar. İlk eşiğe ulaşıldığında iki maden kurar.
PopulationPerPitchrig: Yapay zekâ, bu nüfus kapasitesi başına bir zift kuyusu kurar.
MaxQuarries: Yapay zekânın kuracağı en fazla taş ocağı sayısı.
MaxIronmines: Yapay zekânın kuracağı en fazla demir madeni sayısı.
MaxWoodcutters: Yapay zekânın kuracağı en fazla oduncu kulübesi sayısı.
MaxPitchrigs: Yapay zekânın kuracağı en fazla zift kuyusu sayısı.
MaxFarms: Yapay zekânın kuracağı en fazla çiftlik sayısı. Şerbetçi otu çiftlikleri bu sınıra dahil değildir.
BuildInterval: Onarımlar dahil, AIV içindeki ve dışındaki tüm yapay zekâ inşaatları arasındaki süre. 1 en hızlı değerdir.
ResourceRebuildDelay: AIV'de tanımlanmayan bir kaynak binasını yeniden kurmayı denemeden önce beklenecek süre.
MaxFood: >-
  Her yiyecek türünün (elma, peynir, et, ekmek ve buğday) en fazla miktarı; MaxResourceVariance buna eklenir.
  Sınır toplam miktara değil, her kaynağa ayrı uygulanır.
MinimumApples: >-
  Elma miktarı bunun altındaysa yapay zekâ, eşiğe ulaşana kadar TradeAmountFood büyüklüğünde partiler satın
  alır. 0, hiç elma satın almamak demektir.
MinimumCheese: >-
  Peynir miktarı bunun altındaysa yapay zekâ, eşiğe ulaşana kadar TradeAmountFood büyüklüğünde partiler satın
  alır. 0, hiç peynir satın almamak demektir.
MinimumBread: >-
  Ekmek miktarı bunun altındaysa yapay zekâ, eşiğe ulaşana kadar TradeAmountFood büyüklüğünde partiler satın
  alır. 0, hiç ekmek satın almamak demektir. Ekmek üreten bir ekonomide bunu 0 bırakıp buğday satın almak daha
  uygun olabilir.
MinimumWheat: >-
  Buğday miktarı bunun altındaysa yapay zekâ, eşiğe ulaşana kadar TradeAmountFood büyüklüğünde partiler satın
  alır. 0, hiç buğday satın almamak demektir.
MinimumHop: >-
  Şerbetçi otu miktarı bunun altındaysa yapay zekâ, eşiğe ulaşana kadar TradeAmountFood büyüklüğünde partiler
  satın alır. 0, hiç şerbetçi otu satın almamak demektir.
TradeAmountFood: >-
  Her işlemde satın alınan yiyecek miktarı; aynı anda yalnızca tek tür alınır. Düşük değer daha ucuz ve
  güvenilir alımlar sağlar, ancak daha fazla işlem gerektirir, stokları daha yavaş doldurur ve kısa süreli
  kıtlığa yol açabilir.
TradeAmountEquipment: >-
  Her işlemde satın alınan teçhizat miktarı; aynı anda yalnızca tek tür alınır. Düşük değer daha ucuz ve
  güvenilir alımlar sağlar, ancak daha fazla işlem gerektirir, stokları daha yavaş doldurur ve kısa süreli
  eksikliğe yol açabilir.
AIRequestDelay: Yapay zekânın oyuncudan kaynak isteme aralığı. Düşük değer daha sık istek anlamına gelir.
MinimumGoodsRequiredAfterTrade: >-
  Yapay zekânın bir takas isteğini kabul etmesi için işlemden sonra elinde kalması gereken miktar. Aksi halde
  isteği reddeder.
DoubleRationsFoodThreshold: Elma, peynir, et ve ekmeğin toplamı bu eşiği aştığında yapay zekâ çift tayın verir.
MaxWood: En fazla odun miktarı; MaxResourceVariance buna eklenir.
MaxStone: En fazla taş miktarı; MaxResourceVariance buna eklenir.
MaxResourceOther: >-
  En fazla demir, zift, şerbetçi otu ve un miktarı; MaxResourceVariance buna eklenir. Toplam miktara değil,
  her kaynağa ayrı uygulanır.
MaxEquipment: >-
  Her silah ve zırh türünün en fazla miktarı; MaxResourceVariance buna eklenir. Toplam miktara değil, her türe
  ayrı uygulanır.
MaxBeer: En fazla bira miktarı; MaxResourceVariance buna eklenir.
MaxResourceVariance: Kaynakların herhangi bir en yüksek miktar sınırı üzerinde izin verilen sapma.
RecruitGoldThreshold: Birim toplamadan önce gereken en az altın miktarı.
