add_castle_message: |-
  Bu kale {{name}} projesine eklensin mi?
  Yapay zekâya ekle, kaleyi yapay zekânın aiv klasörüne kopyalar ve projeyi açık tutar.
  Ayrı düzenle, yapay zekâ projesinden çıkar ve kaleyi başka bir konuma kaydetmenizi sağlar.
new_castle_message: |-
  {{name}} projesinde yeni bir kale oluşturulsun mu?
  Yapay zekâya ekle, kaleyi yapay zekânın aiv klasörüne kaydeder ve projeyi açık tutar.
  Ayrı düzenle, yapay zekâ projesinden çıkar ve kaleyi başka bir konuma kaydetmenizi sağlar.
replace_character_message: |-
  {{name}} için bu karakter kullanılsın mı?
  Yapay zekâya ekle, yapay zekânın mevcut character.json dosyasını kalıcı olarak değiştirir.
  Ayrı düzenle, yapay zekâ projesinden çıkar ve mevcut karakter dosyasını korur.
new_character_message: |-
  {{name}} için yeni bir karakter oluşturulsun mu?
  Yapay zekâya ekle, yapay zekânın mevcut character.json dosyasını kalıcı olarak değiştirir.
  Ayrı düzenle, yapay zekâ projesinden çıkar ve mevcut karakter dosyasını korur.
