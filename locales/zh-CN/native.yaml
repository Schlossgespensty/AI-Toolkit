add_castle_message: |-
  将此城堡添加到 {{name}}？
  “添加到 AI”会将其复制到该 AI 的 aiv 文件夹，并保持项目打开。
  “单独编辑”会退出 AI 项目，你可以将城堡保存到其他位置。
new_castle_message: |-
  在 {{name}} 中创建新城堡？
  “添加到 AI”会将其保存到该 AI 的 aiv 文件夹，并保持项目打开。
  “单独编辑”会退出 AI 项目，你可以将城堡保存到其他位置。
replace_character_message: |-
  为 {{name}} 使用此角色？
  “添加到 AI”会永久替换该 AI 现有的 character.json。
  “单独编辑”会退出 AI 项目，并保留项目现有的角色文件。
new_character_message: |-
  为 {{name}} 创建新角色？
  “添加到 AI”会永久替换该 AI 现有的 character.json。
  “单独编辑”会退出 AI 项目，并保留项目现有的角色文件。
