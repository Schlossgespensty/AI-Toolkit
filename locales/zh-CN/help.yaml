HarassingSiegeEngine7: |-
  AI 招募的第 7 台袭扰攻城器械。

  从工程师公会出发前往敌方城堡，沿路攻击建筑；火弩炮也攻击单位。
HarassingSiegeEngine8: |-
  AI 招募的第 8 台袭扰攻城器械。

  从工程师公会出发前往敌方城堡，沿路攻击建筑；火弩炮也攻击单位。

  HarassingSiegeEngine8 之后重新从列表开头开始。
HarassingSiegeEnginesMax: 场上同时存在的袭扰攻城器械最大数量。
RaidRetargetDelay: 袭扰部队选择下一个建筑目标前的等待时间。
AttForceBase: AI 发起进攻前招募的进攻单位数量。每次进攻后按 UCP 设置增加；原版每次增加 5。
AttForceRandom: AI 处于强势且黄金充足时，可能在 AttForceBase 基础上额外增加的单位数量。
AttForceSupportAllyThreshold: AI 执行玩家的进攻或援助命令前，必须招募的进攻单位数量。
AttForceRallyPercentage: 发起进攻前，必须到达集结点的单位比例（%）。
Unknown129: |-
  影响接近于零。当进攻被判定为弱到无法造成伤害时，必须到达集结点才开始撤退的单位比例（%）。

  也表示这些撤退单位中必须返回主堡后，才会开始招募下一波进攻部队的比例。
AttAssaultDelay: 进攻开始后，进攻单位和攻城器械在集结点等待多久才真正出击。
AttUnitPatrolRecommandDelay: |-
  进攻成功后撤退前的等待时间。

  通常应设为 0，因为 AI 没有必要在敌方墓地等待。
Unknown132: 等待盟友一起进攻的概率（%）。在后期，盟友开始进攻时，也可能让 AI 在尚未完成全部招募前就出兵配合。
SiegeEngine1: AI 为进攻招募的第 1 台攻城器械。
SiegeEngine2: AI 为进攻招募的第 2 台攻城器械。
SiegeEngine3: AI 为进攻招募的第 3 台攻城器械。
SiegeEngine4: AI 为进攻招募的第 4 台攻城器械。
SiegeEngine5: AI 为进攻招募的第 5 台攻城器械。
SiegeEngine6: AI 为进攻招募的第 6 台攻城器械。
SiegeEngine7: AI 为进攻招募的第 7 台攻城器械。
SiegeEngine8: |-
  AI 为进攻招募的第 8 台攻城器械。

  最多只能有八台进攻攻城器械。
CowThrowInterval: 投石车投掷一头死牛前需要先投掷的石块数量。
Unknown142: 未使用的值。
AttMaxEngineers: 操控 SiegeEngine 栏位器械的工程师最大数量。应至少满足所有这些器械的总操作人数需求。
AttDiggingUnit: 进攻时填平敌方护城河所用的兵种。
AttDiggingUnitMax: 每次进攻招募的挖掘单位上限。
AttUnitVanguard: 先于其他所有单位冲向敌方城堡的兵种。
AttUnitVanguardMax: 每次进攻招募的先锋单位上限。
AttMaxAssassins: 围攻时尝试攀爬敌方城门的刺客上限。
AttMaxLaddermen: 围攻时尝试将梯子架到城墙上的云梯兵上限。
AttMaxTunnelers: 尝试朝敌方主堡挖掘隧道的掘地兵上限。
AttUnitPatrol: 在敌方城堡周围巡逻并射击敌军的单位。
AttUnitPatrolMax: 每次进攻招募的巡逻单位上限。
AttUnitPatrolGroupsCount: 进攻开始时巡逻单位分成的组数。
AttUnitBackup: 留在集结点，只有存在通往敌方主堡的路径时才进攻的单位。其他进攻单位全部阵亡后会撤退。
AttUnitBackupMax: 每次进攻招募的后备单位上限。
AttUnitBackupGroupsCount: 攻击敌方主堡时后备单位分成的组数。
AttUnitEngage: 优先攻击敌方单位和农民而不是城墙的兵种。
AttUnitEngageMax: 每次进攻招募的交战单位上限。
AttUnitSiegeDef: 进攻时留在攻城器械旁的护卫单位。它们也可能护卫袭扰器械和防御器械，而不仅是进攻器械。
AttUnitSiegeDefMax: 每次进攻招募的攻城器械护卫上限。
AttUnitSiegeDefGroupsCount: 进攻时攻城器械护卫分成的组数。
AttUnitMain1: |-
  主力进攻部队招募的第 1 种单位。只有这些单位的规模会无限增长。

  无力支付当前栏位时会尝试下一个。
AttUnitMain2: |-
  主力进攻部队招募的第 2 种单位。只有这些单位的规模会无限增长。

  无力支付当前栏位时会尝试下一个。
AttUnitMain3: |-
  主力进攻部队招募的第 3 种单位。只有这些单位的规模会无限增长。

  无力支付当前栏位时会尝试下一个。
AttUnitMain4: |-
  主力进攻部队招募的第 4 种单位。只有这些单位的规模会无限增长。

  无力支付当前栏位时会尝试下一个。

  AttUnitMain4 之后重新从列表开头开始。
AttMaxDefault: |-
  在所有特殊职责（AttLaddermen、AttAssassins、AttUnitPatrol 等）招满之前，允许先招募的主力单位数量。
  设为 0 时，必须先招满所有特殊职责单位，才能招募 AttUnitMain。
AttMainGroupsCount: 进攻时 AttUnitMain 主力单位分成的组数。
TargetChoice: |-
  设置 AI 选择进攻目标的方式。

  黄金：总是攻击黄金最多的敌方玩家。

  均衡：根据计算得出的弱点评分选择，最复杂、最细致。

  最近：总是攻击最近的敌人，按主堡之间的距离计算。

  任意：攻击内部玩家列表中的下一个敌人，看似随机但顺序固定。

  玩家：优先攻击人类玩家；没有敌对人类玩家时改用“最近”。
AIOxTethers_DisableInitialOxTether: “否”保持原版行为；“是”表示不再每次建造或重建采石场时自动建造牛车站。
AIOxTethers_Logic: |-
  设置采用的逻辑。
  否 = 原版，是 = 动态。
AIOxTethers_MaxOxTethers: 此 AI 的牛车站总数永不超过此值。
AIOxTethers_DynamicMaxOxTethers: 此 AI 的牛车站总数永不超过此值乘以采石场数量。
AIOxTethers_MinimumOxTethersPerQuarry: 从某座采石场运输石料的关联牛车站少于此值时，为该采石场增建一座牛车站。
AIOxTethers_MaximumOxTethersPerQuarry: 某座采石场关联的牛车站数量高于此值时，不再为它增建牛车站。
AIOxTethers_ThresholdStoneLoad: 某座采石场的“石料 / 关联牛车站”超过此值时，为它增建一座牛车站。
RunningUnits_Macemen: |-
  设为“是”时，链锤兵始终奔跑，即使与较慢单位编组。
  设为“否”时，速度与组内最慢单位一致，与原版相同。
RunningUnits_Spearmen: |-
  设为“是”时，长矛兵始终奔跑，即使与较慢单位编组。
  设为“否”时，速度与组内最慢单位一致，与原版相同。
RunningUnits_Slingers: |-
  设为“是”时，投石兵始终奔跑，即使与较慢单位编组。
  设为“否”时，速度与组内最慢单位一致，与原版相同。
RunningUnits_Slaves: |-
  设为“是”时，奴隶始终奔跑，即使与较慢单位编组。
  设为“否”时，速度与组内最慢单位一致，与原版相同。
AIVTroops_InitialRole: |-
  分配尚未分配职责的开局或场景部队。挖掘要求单位实际具备挖掘能力且存在护城河格，否则改为防守。

  所有支持兵种的通用默认值。选择原版时，保存的角色不包含此字段，改用下一个适用的通用或菜单默认值。需要 aiv-troops-behaviour，并启用部队设置和 AIC 覆盖。修改后须重启 UCP 并开始新游戏。
AIVTroops_Movement: |-
  防守单位在 AIV 位置间的移动方式。巡逻使用 DefWallPatrolGroups 和 DefWallPatrolRallyTime；组数为零时原地驻守。

  所有支持兵种的通用默认值。选择原版时，保存的角色不包含此字段，改用下一个适用的通用或菜单默认值。需要 aiv-troops-behaviour，并启用部队设置和 AIC 覆盖。修改后须重启 UCP 并开始新游戏。
