StrengthMultiplier: |-
  领主生命值的倍率。
  老鼠 = 0.5
  默认 = 1
  野狼 = 1.5
DotColour: |-
  表示领主强度的圆点颜色。
  原版用黄色表示较弱的 AI，蓝色表示较强的 AI。
DotCount: |-
  表示领主强度的圆点数量。
  原版每 0.1 倍率对应一个圆点。
Type: 在主堡出现的领主类型。
ArabArcher: 游戏开始时在主堡旁生成的阿拉伯弓箭手数量。
Slave: 游戏开始时在主堡旁生成的奴隶数量。
Slinger: 游戏开始时在主堡旁生成的投石兵数量。
Assassin: 游戏开始时在主堡旁生成的刺客数量。
HorseArcher: 游戏开始时在主堡旁生成的骑射手数量。
ArabSwordsman: 游戏开始时在主堡旁生成的阿拉伯剑士数量。
FireThrower: 游戏开始时在主堡旁生成的火焰投掷兵数量。
EuropArcher: 游戏开始时在主堡旁生成的欧洲弓箭手数量。
Spearman: 游戏开始时在主堡旁生成的长矛兵数量。
Maceman: 游戏开始时在主堡旁生成的链锤兵数量。
Crossbowman: 游戏开始时在主堡旁生成的弩手数量。
Pikeman: 游戏开始时在主堡旁生成的长戟兵数量。
Swordsman: 游戏开始时在主堡旁生成的剑士数量。
Knight: 游戏开始时在主堡旁生成的骑士数量。
Monk: 游戏开始时在主堡旁生成的僧侣数量。
WallDecoration: |-
  在 AIV 编辑器中放置 flg 时使用的装饰类型。

  8 = 倾倒燃烧的油
  9 = 火焰
  10 = 小旗
  11 = 大旗
  12 = 中旗
  13 = 十字军旗
  14 = 火盆
  15 = 装饰骷髅
  21 = 蒸汽云
  22 = 疾病云
  26 = 火焰爆炸
  28 = 俯冲乌鸦
  29 = 中型石块落水
  30 = 小石块击中建筑
  31 = 小石块落水
  40 = 零黄金浮动提示
  41 = 零民心浮动提示
  42 = 空白浮动提示
  43 = 空白浮动提示
Unknown001: 未使用的值。
Unknown002: 未使用的值。
Unknown003: 未使用的值。
Unknown004: 未使用的值。
Unknown005: 未使用的值。
CriticalPopularity: |-
  民心低于此值时，AI 会大量出售物资以获取黄金。

  10000 = 100 民心。
  5000 = 50 民心。
LowestPopularity: |-
  民心低于此值时，AI 会逐步将税率调向 TaxesMin，并提供额外口粮，直到达到 HighestPopularity。

  10000 = 100 民心。
  5000 = 50 民心。
HighestPopularity: |-
  民心高于此值时，AI 会提高税率，直到民心变化稳定在最低约 −3。

  10000 = 100 民心。
  5000 = 50 民心。
TaxesMin: |-
  允许的最低税率档位。
  0 = 最高补贴
  11 = 最高税率
TaxesMax: |-
  允许的最高税率档位。
  0 = 最高补贴
  11 = 最高税率
Unknown011: 未使用的值。
Farm1: |-
  AI 建造的第 1 座农场。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
Farm2: |-
  AI 建造的第 2 座农场。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
Farm3: |-
  AI 建造的第 3 座农场。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
Farm4: |-
  AI 建造的第 4 座农场。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
Farm5: |-
  AI 建造的第 5 座农场。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
Farm6: |-
  AI 建造的第 6 座农场。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
Farm7: |-
  AI 建造的第 7 座农场。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
Farm8: |-
  AI 建造的第 8 座农场。Farm8 之后重新从列表开头开始。

  被摧毁的农场不会用同类型重建，而是采用队列中的下一项。
PopulationPerFarm: |-
  每有这么多可容纳人口，AI 就建造一座农场。第一座农场始终在 0 人口时建造。

  啤酒花农场不计入此值，轮到它时就会建造。
PopulationPerWoodcutter: 每有这么多可容纳人口，AI 就建造一座伐木场。第一次达到该人口时会建造两座。
PopulationPerQuarry: 每有这么多可容纳人口，AI 就建造一座采石场。第一次达到该人口时会建造两座。
PopulationPerIronmine: 每有这么多可容纳人口，AI 就建造一座铁矿场。第一次达到该人口时会建造两座。
PopulationPerPitchrig: 每有这么多可容纳人口，AI 就建造一座沥青矿场。
MaxQuarries: AI 建造的采石场最大数量。
MaxIronmines: AI 建造的铁矿场最大数量。
MaxWoodcutters: AI 建造的伐木场最大数量。
MaxPitchrigs: AI 建造的沥青矿场最大数量。
MaxFarms: |-
  AI 建造的农场最大数量。

  啤酒花农场不计入此值。
BuildInterval: |-
  AI 的建造速度。适用于 AIV 建筑、非 AIV 建筑以及所有维修。

  1 为最快。
ResourceRebuildDelay: AI 尝试重建非 AIV 资源建筑之前的等待时间。
MaxFood: |-
  苹果、奶酪、肉、面包和小麦各自的库存上限，另加 ResourceVariance。

  此值分别适用于每种物资，不是合计值。
MinimumApples: |-
  苹果库存低于此值时，AI 每次购买 [TradeAmountFood] 个苹果，直到恢复至该值。

  设为 0 时永不购买苹果。
MinimumCheese: |-
  奶酪库存低于此值时，AI 每次购买 [TradeAmountFood] 份奶酪，直到恢复至该值。

  设为 0 时永不购买奶酪。
MinimumBread: |-
  面包库存低于此值时，AI 每次购买 [TradeAmountFood] 个面包，直到恢复至该值。

  设为 0 时永不购买面包。

  有面包生产链时，设为 0 并改买小麦可能更合适。
MinimumWheat: |-
  小麦库存低于此值时，AI 每次购买 [TradeAmountFood] 份小麦，直到恢复至该值。

  设为 0 时永不购买小麦。
MinimumHop: 啤酒花库存低于此值时，AI 每次购买 [TradeAmountFood] 份啤酒花，直到恢复至该值。设为 0 时永不购买。
TradeAmountFood: |-
  AI 每次购买的食物数量，每次只购买一种食物。

  数值较小时，单次采购更便宜，也更容易完成，但可能需要更多次采购，补货更慢且可能出现短暂短缺。
TradeAmountEquipment: |-
  AI 每次购买的武器数量，每次只购买一种装备。

  数值较小时，单次采购更便宜，也更容易完成，但可能需要更多次采购，补货更慢且可能出现短暂短缺。
AIRequestDelay: AI 向玩家请求资源的频率。数值越低，请求越频繁。
MinimumGoodsRequiredAfterTrade: 与玩家交易后，AI 必须保留的该资源最低数量。否则会拒绝交易。
DoubleRationsFoodThreshold: 苹果、奶酪、肉和面包的总量超过此值时，AI 提供双倍口粮。
MaxWood: 木材库存上限，另加 ResourceVariance。
MaxStone: 石料库存上限，另加 ResourceVariance。
MaxResourceOther: |-
  铁、沥青、啤酒花和面粉各自的库存上限，另加 ResourceVariance。

  分别适用于每种物资，不是合计值。
MaxEquipment: 武器与铠甲各自的库存上限，另加 ResourceVariance。分别适用于每种类型，不是合计值。
MaxBeer: 啤酒库存上限，另加 ResourceVariance。
MaxResourceVariance: 允许超出各项 Max[Resource] 上限的浮动量。
RecruitGoldThreshold: AI 开始招募单位前所需的最低黄金数量。
BlacksmithSetting: 设置铁匠铺的生产类型。选择“两者”时，第一座生产剑，第二座生产链锤，第三座生产剑，以此类推。
FletcherSetting: 设置弓弩作坊的生产类型。选择“两者”时，第一座生产弓，第二座生产弩，第三座生产弓，以此类推。
PoleturnerSetting: 设置长柄武器作坊的生产类型。选择“两者”时，第一座生产长矛，第二座生产长戟，第三座生产长矛，以此类推。
SellResource01: AI 获得此资源后总会立即出售。
SellResource02: AI 获得此资源后总会立即出售。
SellResource03: AI 获得此资源后总会立即出售。
SellResource04: AI 获得此资源后总会立即出售。
SellResource05: AI 获得此资源后总会立即出售。
SellResource06: AI 获得此资源后总会立即出售。
SellResource07: AI 获得此资源后总会立即出售。
SellResource08: AI 获得此资源后总会立即出售。
SellResource09: AI 获得此资源后总会立即出售。
SellResource10: AI 获得此资源后总会立即出售。
SellResource11: AI 获得此资源后总会立即出售。
SellResource12: AI 获得此资源后总会立即出售。
SellResource13: AI 获得此资源后总会立即出售。
SellResource14: AI 获得此资源后总会立即出售。
SellResource15: AI 获得此资源后总会立即出售。
DefWallPatrolRallyTime: 城墙守军前往下一个 AIV 单位位置前的等待时间。并非所有城墙守军都能巡逻。
DefWallPatrolGroups: 在 AIV 位置之间巡逻的城墙守军组数。
DefSiegeEngineGoldThreshold: AI 建造 AIV 攻城器械前所需的黄金数量。
DefSiegeEngineBuildDelay: 重建已摧毁 AIV 攻城器械前的等待时间。数值越低，等待越短。
Unknown072: 未使用的值。
Unknown073: 未使用的值。
RecruitProbDefDefault: |-
  AI 在普通状态下招募防守部队的概率。

  弱势：几乎不启用，通常仅在濒临失败时。普通：通常为开局前几年。强势：最常见，人口和单位数量超过 40 时往往已达到。
RecruitProbDefWeak: |-
  AI 在弱势状态下招募防守部队的概率。

  弱势：几乎不启用，通常仅在濒临失败时。普通：通常为开局前几年。强势：最常见，人口和单位数量超过 40 时往往已达到。
