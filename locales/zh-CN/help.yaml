AIVTroops_InitialRole_ArabianArcher: >-
  分配尚未分配职责的开局或场景部队。挖掘要求单位实际具备挖掘能力且存在护城河格，否则改为防守。


  兵种专用设置优先于通用 AIC 字段。选择原版时，保存的角色不包含此字段，改用下一个适用的通用或菜单默认值。需要 aiv-troops-behaviour，并启用部队设置和 AIC 覆盖。修改后须重启 UCP
  并开始新游戏。
AIVTroops_Movement_ArabianArcher: >-
  防守单位在 AIV 位置间的移动方式。巡逻使用 DefWallPatrolGroups 和 DefWallPatrolRallyTime；组数为零时原地驻守。


  兵种专用设置优先于通用 AIC 字段。选择原版时，保存的角色不包含此字段，改用下一个适用的通用或菜单默认值。需要 aiv-troops-behaviour，并启用部队设置和 AIC 覆盖。修改后须重启 UCP
  并开始新游戏。
