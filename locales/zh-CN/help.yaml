SortieUnitRangedMin: |-
  远程出击部队的最低数量。

  弱势：几乎不启用，通常仅在濒临失败时。
  普通：通常为开局前几年。
  强势：最常见，人口和单位数量超过 40 时往往已达到。
SortieUnitRanged: |-
  远程出击部队的类型。它们会在城外工人死亡的位置驻守。被消灭的次数越多，规模越大；后期通常比设定值多招募约 25 个单位。

  即使设为 0 仍会招募。要禁用，请选择无法招募的单位。

  出击部队的招募优先级始终高于其他单位。
SortieUnitMeleeMin: 近战出击部队的确切数量。
SortieUnitMelee: |-
  拦截破坏建筑的敌军所用的出击兵种。目标死亡后会返回主堡顶部。

  出击部队的招募优先级始终高于其他单位。
DefDiggingUnitMax: 挖掘单位的招募上限。只要 AI 或盟友计划挖掘护城河，就会优先于防守、袭扰和进攻部队招募它们。
DefDiggingUnit: 挖掘己方或盟友护城河所用的兵种。
RecruitInterval: |-
  AI 在普通状态下招募下一个单位前的等待时间。1 为最快。

  弱势：几乎不启用，通常仅在濒临失败时。普通：通常为开局前几年。强势：最常见，人口和单位数量超过 40 时往往已达到。
RecruitIntervalWeak: |-
  AI 在弱势状态下招募下一个单位前的等待时间。1 为最快。

  弱势：几乎不启用，通常仅在濒临失败时。普通：通常为开局前几年。强势：最常见，人口和单位数量超过 40 时往往已达到。
RecruitIntervalStrong: |-
  AI 在强势状态下招募下一个单位前的等待时间。1 为最快。

  弱势：几乎不启用，通常仅在濒临失败时。普通：通常为开局前几年。强势：最常见，人口和单位数量超过 40 时往往已达到。
DefTotal: AI 招募的防守部队总数。
OuterPatrolGroupsCount: 在经济建筑周围巡逻的防守部队组数。
OuterPatrolGroupsMove: 城墙守军以外的防守部队是否在经济建筑周围巡逻，或停留原地（通常靠近采石场）。
OuterPatrolRallyDelay: 城墙守军以外的防守部队前往下一位置前的等待时间。
DefWalls: 防守总兵力中用作城墙守军的数量。它们前往城内 AIV 位置，其余部队巡逻经济建筑。
DefUnit1: |-
  AI 尝试招募的第 1 种防守单位。

  无力支付当前栏位时会尝试下一个。
