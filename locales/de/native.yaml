add_castle_message: |-
  Diese Burg zu {{name}} hinzufügen?
  „Zur KI hinzufügen“ kopiert sie in den aiv-Ordner der KI und hält das Projekt geöffnet.
  „Separat bearbeiten“ verlässt das KI-Projekt. Du kannst die Burg dann an einem anderen Ort speichern.
new_castle_message: |-
  Eine neue Burg in {{name}} erstellen?
  „Zur KI hinzufügen“ speichert sie im aiv-Ordner der KI und hält das Projekt geöffnet.
  „Separat bearbeiten“ verlässt das KI-Projekt. Du kannst die Burg dann an einem anderen Ort speichern.
replace_character_message: |-
  Diesen Charakter für {{name}} verwenden?
  „Zur KI hinzufügen“ ersetzt die bisherige character.json der KI dauerhaft.
  „Separat bearbeiten“ verlässt das KI-Projekt und behält dessen bisherige Charakterdatei bei.
new_character_message: |-
  Einen neuen Charakter für {{name}} erstellen?
  „Zur KI hinzufügen“ ersetzt die bisherige character.json der KI dauerhaft.
  „Separat bearbeiten“ verlässt das KI-Projekt und behält dessen bisherige Charakterdatei bei.
