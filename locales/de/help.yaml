SortieUnitRangedMin: |-
  Mindestzahl der Fernkampfeinheiten für Ausfälle.

  Schwach: fast nie aktiv, meist kurz vor der Niederlage.
  Normal: meist die ersten Spieljahre.
  Stark: am häufigsten aktiv, oft schon bei Bevölkerung und Truppenzahl > 40.
SortieUnitRanged: >-
  Fernkampftyp für Ausfälle. Diese Einheiten stehen außerhalb der Burg an Stellen, wo Arbeiter starben. Nach
  wiederholten Verlusten wächst ihre Anzahl; später werden meist etwa 25 mehr als eingestellt rekrutiert.


  Auch bei 0 wird rekrutiert. Zum Deaktivieren einen nicht rekrutierbaren Typ wählen.


  Ausfalleinheiten haben immer Vorrang vor allen anderen Rekrutierungen.
SortieUnitMeleeMin: Genaue Anzahl der Nahkampfeinheiten für Ausfälle.
SortieUnitMelee: >-
  Einheitentyp für Ausfälle gegen Truppen, die Gebäude zerstören. Nach dem Tod des Ziels kehren sie auf den
  Bergfried zurück.


  Ausfalleinheiten haben immer Vorrang vor allen anderen Rekrutierungen.
DefDiggingUnitMax: >-
  Maximale Anzahl rekrutierter Grabeneinheiten. Solange die KI oder ein Verbündeter einen Graben plant, werden
  sie vor Verteidigern, Überfall- und Angriffstruppen rekrutiert.
DefDiggingUnit: Einheitentyp zum Ausheben eigener Gräben oder der Gräben eines Verbündeten.
RecruitInterval: >-
  Wartezeit vor der nächsten Rekrutierung im Zustand „Normal“. 1 ist am schnellsten.


  Schwach: fast nie aktiv, meist kurz vor der Niederlage. Normal: meist die ersten Spieljahre. Stark: am
