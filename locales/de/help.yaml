  Zerstörte Farmen werden nicht durch denselben Typ ersetzt, sondern durch den nächsten in der Reihenfolge.
PopulationPerFarm: >-
  Je dieser Anzahl unterbringbarer Einwohner baut die KI eine Farm. Die erste Farm wird immer bei Bevölkerung
  0 gebaut.


  Hopfenfarmen zählen nicht mit und werden gebaut, sobald sie in der Reihenfolge anstehen.
PopulationPerWoodcutter: >-
  Je dieser Anzahl unterbringbarer Einwohner baut die KI einen Holzfäller. Beim ersten Erreichen dieser Anzahl
  werden stattdessen zwei gebaut.
PopulationPerQuarry: >-
  Je dieser Anzahl unterbringbarer Einwohner baut die KI einen Steinbruch. Beim ersten Erreichen dieser Anzahl
  werden stattdessen zwei gebaut.
PopulationPerIronmine: >-
  Je dieser Anzahl unterbringbarer Einwohner baut die KI eine Eisenmine. Beim ersten Erreichen dieser Anzahl
  werden stattdessen zwei gebaut.
PopulationPerPitchrig: Je dieser Anzahl unterbringbarer Einwohner baut die KI eine Pechgrube.
MaxQuarries: Höchstzahl der Steinbrüche, die die KI baut.
MaxIronmines: Höchstzahl der Eisenminen, die die KI baut.
MaxWoodcutters: Höchstzahl der Holzfäller, die die KI baut.
MaxPitchrigs: Höchstzahl der Pechgruben, die die KI baut.
MaxFarms: |-
  Höchstzahl der Farmen, die die KI baut.

  Hopfenfarmen zählen nicht mit.
BuildInterval: |-
  Baugeschwindigkeit der KI. Gilt für AIV-Gebäude, externe Gebäude und alle Reparaturen.

  1 ist am schnellsten.
ResourceRebuildDelay: Wartezeit vor dem Wiederaufbau eines Rohstoffgebäudes außerhalb der AIV.
MaxFood: |-
  Höchstbestand an Äpfeln, Käse, Fleisch, Brot und Weizen, zuzüglich ResourceVariance.

  Der Wert gilt je Warentyp, NICHT insgesamt.
MinimumApples: >-
  Unter diesem Apfelbestand kauft die KI jeweils [TradeAmountFood] Äpfel nach, bis der Wert wieder erreicht
  ist.


  Bei 0 kauft die KI niemals Äpfel.
MinimumCheese: |-
  Unter diesem Käsebestand kauft die KI jeweils [TradeAmountFood] Käse nach, bis der Wert wieder erreicht ist.

  Bei 0 kauft die KI niemals Käse.
MinimumBread: |-
  Unter diesem Brotbestand kauft die KI jeweils [TradeAmountFood] Brot nach, bis der Wert wieder erreicht ist.

  Bei 0 kauft sie niemals Brot.

  Bei einer Brotwirtschaft kann 0 sinnvoller sein, um stattdessen Weizen zu kaufen.
MinimumWheat: >-
  Unter diesem Weizenbestand kauft die KI jeweils [TradeAmountFood] Weizen nach, bis der Wert wieder erreicht
  ist.


  Bei 0 kauft sie niemals Weizen.
MinimumHop: >-
  Unter diesem Hopfenbestand kauft die KI jeweils [TradeAmountFood] Hopfen nach, bis der Wert wieder erreicht
  ist. Bei 0 kauft sie niemals Hopfen.
TradeAmountFood: >-
  Nahrungsmenge je Einkauf. Die KI kauft jeweils nur einen Nahrungstyp.


  Ein niedriger Wert macht Einkäufe günstiger und damit wahrscheinlicher, kann aber mehr Einkäufe erfordern:
  langsameres Auffüllen und mögliche kurze Engpässe.
TradeAmountEquipment: >-
  Waffenmenge je Einkauf. Die KI kauft jeweils nur einen Ausrüstungstyp.


  Ein niedriger Wert macht Einkäufe günstiger und damit wahrscheinlicher, kann aber mehr Einkäufe erfordern:
  langsameres Auffüllen und mögliche kurze Engpässe.
AIRequestDelay: Häufigkeit der Rohstoffanfragen an den Spieler. Niedrigerer Wert → häufiger.
MinimumGoodsRequiredAfterTrade: >-
  Mindestbestand einer Ware, der der KI nach einem Handel mit dem Spieler bleiben muss. Andernfalls lehnt sie
  den Handel ab.
DoubleRationsFoodThreshold: >-
  Wenn der gemeinsame Bestand an Äpfeln, Käse, Fleisch und Brot diesen Wert übersteigt, gibt die KI doppelte
  Rationen.
MaxWood: Höchster Holzbestand, zuzüglich ResourceVariance.
MaxStone: Höchster Steinbestand, zuzüglich ResourceVariance.
MaxResourceOther: |-
  Höchstbestand an Eisen, Pech, Hopfen und Mehl, zuzüglich ResourceVariance.

  Gilt je Warentyp, nicht insgesamt.
MaxEquipment: Höchstbestand an Waffen und Rüstungen, zuzüglich ResourceVariance. Gilt je Typ, nicht insgesamt.
MaxBeer: Höchster Bierbestand, zuzüglich ResourceVariance.
MaxResourceVariance: Erlaubte Abweichung von jedem „Max[Resource]“-Wert.
RecruitGoldThreshold: Mindestgoldbestand, bevor die KI mit dem Rekrutieren beginnt.
BlacksmithSetting: >-
  Legt die Schmiedeproduktion fest. Bei „Beide“ fertigt die erste Schmiede Schwerter, die zweite Keulen, die
  dritte Schwerter usw.
FletcherSetting: >-
  Legt die Bogenmacherproduktion fest. Bei „Beide“ fertigt der erste Bögen, der zweite Armbrüste, der dritte
  Bögen usw.
PoleturnerSetting: >-
  Legt die Lanzenmacherproduktion fest. Bei „Beide“ fertigt der erste Lanzen, der zweite Piken, der dritte
  Lanzen usw.
