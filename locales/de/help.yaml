RaidUnitsBase: Anzahl der Einheiten für Überfälle auf gegnerische Gebäude.
RaidUnitsRandom: Mögliche zusätzliche Einheiten über RaidUnitsBase hinaus, wenn die KI stark ist und viel Gold hat.
