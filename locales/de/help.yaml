DefTotal: Gesamtzahl der Verteidigungseinheiten, die die KI rekrutiert.
OuterPatrolGroupsCount: Anzahl der Verteidigergruppen, die die Wirtschaftsgebäude patrouillieren.
OuterPatrolGroupsMove: >-
