StrengthMultiplier: |-
  Multipliziert die Lebenspunkte des Burgherrn.
  Ratte = 0,5
  Standard = 1
  Wolf = 1,5
DotColour: |-
  Farbe der Punkte, die die Stärke des Burgherrn anzeigen.
  Vanilla verwendet Gelb für schwache und Blau für starke KIs.
DotCount: |-
  Anzahl der Punkte, die die Stärke des Burgherrn anzeigen.
  Vanilla verwendet einen Punkt je 0,1 des Multiplikators.
Type: Typ des Burgherrn, der auf dem Bergfried erscheint.
ArabArcher: Anzahl der Einheiten (Arabischer Bogenschütze), die zu Spielbeginn beim Bergfried erscheinen.
Slave: Anzahl der Einheiten (Sklave), die zu Spielbeginn beim Bergfried erscheinen.
