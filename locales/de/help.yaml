  8 = brennendes auslaufendes Öl
  9 = Flammen
  10 = kleine Flagge
  11 = große Flagge
  12 = mittlere Flagge
  13 = Kreuzritterflagge
  14 = Feuerbecken
  15 = Zierschädel
  21 = Dampfwolken
  22 = Krankheitswolken
  26 = Feuerexplosionen
  28 = herabfliegende Raben
  29 = mittlere Steine im Wasser
  30 = kleine Steine an Gebäuden
  31 = kleine Steine im Wasser
  40 = aufsteigende Null-Gold-Meldung
  41 = aufsteigende Null-Beliebtheitsmeldung
  42 = leere aufsteigende Meldung
  43 = leere aufsteigende Meldung
