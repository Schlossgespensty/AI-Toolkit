DefWallPatrolRallyTime: >-
  Wartezeit der Mauerverteidiger vor dem Weitergehen zum nächsten AIV-Einheitenplatz. Nicht alle
  Mauerverteidiger können patrouillieren.
DefWallPatrolGroups: Anzahl der Mauerverteidigergruppen, die zwischen ihren AIV-Plätzen patrouillieren.
DefSiegeEngineGoldThreshold: Erforderlicher Goldbestand zum Bau von AIV-Belagerungsgeräten.
DefSiegeEngineBuildDelay: Wartezeit vor dem Wiederaufbau zerstörter AIV-Belagerungsgeräte. Kleinerer Wert → kürzere Wartezeit.
