AttForceRallyPercentage: Anteil der Einheiten in %, der sich am Sammelpunkt einfinden muss, bevor die KI angreift.
Unknown129: >-
  Fast ohne Auswirkung. Anteil in % am Sammelpunkt, bevor die KI den Rückzug beginnt, falls ihr Angriff als zu
  schwach bewertet wird.


  Außerdem der Anteil dieser Rückzügler, der den Bergfried erreichen muss, bevor die Rekrutierung für den
  nächsten Angriff beginnt.
AttAssaultDelay: >-
  Wartezeit der Angriffseinheiten und Belagerungsgeräte am Sammelpunkt nach Angriffsbeginn, bevor sie
  vorgeschickt werden.
AttUnitPatrolRecommandDelay: |-
  Wartezeit vor dem Rückzug nach erfolgreichem Angriff.

  Normalerweise 0: Es gibt keinen Grund, am Grab des Gegners zu warten.
Unknown132: >-
  Wahrscheinlichkeit in %, mit einem Angriff auf einen Verbündeten zu warten. Später kann die KI dadurch auch
  vor vollständiger Rekrutierung angreifen, um einen Verbündeten beim Angriff zu unterstützen.
SiegeEngine1: 1. Belagerungsgerät für Angriffe.
SiegeEngine2: 2. Belagerungsgerät für Angriffe.
SiegeEngine3: 3. Belagerungsgerät für Angriffe.
SiegeEngine4: 4. Belagerungsgerät für Angriffe.
SiegeEngine5: 5. Belagerungsgerät für Angriffe.
SiegeEngine6: 6. Belagerungsgerät für Angriffe.
SiegeEngine7: 7. Belagerungsgerät für Angriffe.
SiegeEngine8: 8. Belagerungsgerät für Angriffe. Maximal acht angreifende Belagerungsgeräte sind möglich.
CowThrowInterval: Anzahl der Steinwürfe eines Katapults, bevor es stattdessen eine Kuh wirft.
AttMaxEngineers: >-
  Höchstzahl der Ingenieure zur Bedienung der Geräte in den SiegeEngine-Plätzen. Der Wert sollte mindestens
  deren gemeinsamen Personalbedarf decken.
AttDiggingUnit: Einheit zum Zuschütten gegnerischer Gräben während eines Angriffs.
AttDiggingUnitMax: Höchstzahl der Grabeneinheiten je Angriff.
AttUnitVanguard: Einheit, die vor allen anderen zum Angriff auf die gegnerische Burg läuft.
AttUnitVanguardMax: Höchstzahl der Vorhuteinheiten je Angriff.
AttMaxAssassins: Höchstzahl der Assassinen, die bei Belagerungen gegnerische Torhäuser erklimmen.
AttMaxLaddermen: Höchstzahl der Leiterträger, die bei Belagerungen Leitern an Mauern stellen.
AttMaxTunnelers: Höchstzahl der Tunnelgräber, die in Richtung des gegnerischen Bergfrieds graben.
AttUnitPatrol: Einheiten, die um die gegnerische Burg patrouillieren und gegnerische Einheiten beschießen.
AttUnitPatrolMax: Höchstzahl der Patrouilleneinheiten je Angriff.
AttUnitPatrolGroupsCount: Anzahl der Gruppen, in die sich Patrouilleneinheiten zu Angriffsbeginn aufteilen.
AttUnitBackup: >-
  Einheiten, die am Sammelpunkt bleiben und erst angreifen, wenn ein Weg zum gegnerischen Bergfried frei ist.
  Wenn alle übrigen Angreifer sterben, ziehen sie sich zurück.
AttUnitBackupMax: Höchstzahl der Reserveeinheiten je Angriff.
AttUnitBackupGroupsCount: Anzahl der Reservegruppen beim Angriff auf den gegnerischen Bergfried.
AttUnitEngage: Einheiten, die gegnerische Einheiten und Bauern statt Mauern angreifen.
AttUnitEngageMax: Höchstzahl der Abfangeinheiten je Angriff.
AttUnitSiegeDef: >-
  Belagerungsschutz bleibt während des Angriffs bei Belagerungsgeräten. Dies kann auch Geräte für Störangriffe
  und Verteidigung betreffen.
AttUnitSiegeDefMax: Höchstzahl der Belagerungsschutz-Einheiten je Angriff.
AttUnitSiegeDefGroupsCount: Anzahl der Belagerungsschutzgruppen während eines Angriffs.
AttUnitMain1: |-
  1. Einheit der Hauptangriffsgruppe. Nur diese Einheiten wachsen unbegrenzt mit.

  Wenn die KI einen Platz nicht bezahlen kann, versucht sie den nächsten.
AttUnitMain2: |-
  2. Einheit der Hauptangriffsgruppe. Nur diese Einheiten wachsen unbegrenzt mit.

  Wenn die KI einen Platz nicht bezahlen kann, versucht sie den nächsten.
AttUnitMain3: |-
  3. Einheit der Hauptangriffsgruppe. Nur diese Einheiten wachsen unbegrenzt mit.

  Wenn die KI einen Platz nicht bezahlen kann, versucht sie den nächsten.
AttUnitMain4: |-
  4. Einheit der Hauptangriffsgruppe. Nur diese Einheiten wachsen unbegrenzt mit.

  Wenn die KI einen Platz nicht bezahlen kann, versucht sie den nächsten.

  Nach AttUnitMain4 beginnt die Liste von vorn.
AttMaxDefault: >-
  Anzahl der Hauptangriffseinheiten, die vor vollständiger Rekrutierung ALLER Spezialrollen (AttLaddermen,
  AttAssassins, AttUnitPatrol usw.) rekrutiert werden DÜRFEN.

  Bei 0 müssen zuerst alle Spezialrollen vollständig besetzt sein.
AttMainGroupsCount: Anzahl der Gruppen, in die sich AttUnitMain-Einheiten beim Angriff aufteilen.
TargetChoice: |-
  Legt die Auswahl des Angriffsziels fest.

  Gold: Gegner mit dem meisten Gold.

  Ausgeglichen: berechneter Schwächewert; komplexeste und differenzierteste Zielwahl.

  Am nächsten: nächster Gegner, von Bergfried zu Bergfried gemessen.

  Beliebig: nächster Gegner in der internen Spielerliste. Wirkt zufällig, folgt aber fester Reihenfolge.

  Spieler: bevorzugt menschliche Gegner. Ohne menschlichen Gegner wird „Am nächsten“ verwendet.
AIOxTethers_DisableInitialOxTether: >-
  „Nein“ verwendet Vanilla-Verhalten. „Ja“ verhindert, dass bei jedem (Wieder-)Bau eines Steinbruchs
  automatisch ein Ochsenjoch gebaut wird.
AIOxTethers_Logic: |-
  Angewandte Logik.
  Nein = Vanilla, Ja = dynamisch.
AIOxTethers_MaxOxTethers: Die Gesamtzahl der Ochsenjoche dieser KI überschreitet diesen Wert nie.
AIOxTethers_DynamicMaxOxTethers: Die Gesamtzahl der Ochsenjoche überschreitet diesen Wert multipliziert mit der Anzahl der Steinbrüche nie.
AIOxTethers_MinimumOxTethersPerQuarry: >-
  Wenn weniger als diese Anzahl zugeordneter Ochsenjoche Stein aus einem Steinbruch abholen, wird dort ein
  weiteres gebaut.
AIOxTethers_MaximumOxTethersPerQuarry: Wenn mehr als diese Anzahl Ochsenjoche einem Steinbruch zugeordnet sind, wird dort kein weiteres gebaut.
AIOxTethers_ThresholdStoneLoad: >-
  Wenn Steinmenge / zugeordnete Ochsenjoche diesen Wert für einen Steinbruch übersteigt, wird dort ein
  weiteres Ochsenjoch gebaut.
RunningUnits_Macemen: >-
  Bei „Ja“ laufen Keulenkämpfer immer, auch mit langsameren Einheiten in der Gruppe. Bei „Nein“ passen sie
  sich wie in Vanilla an die langsamste Einheit ihrer Gruppe an.
RunningUnits_Spearmen: >-
  Bei „Ja“ laufen Lanzenträger immer, auch mit langsameren Einheiten in der Gruppe. Bei „Nein“ passen sie sich
  wie in Vanilla an die langsamste Einheit ihrer Gruppe an.
RunningUnits_Slingers: >-
  Bei „Ja“ laufen Schleuderer immer, auch mit langsameren Einheiten in der Gruppe. Bei „Nein“ passen sie sich
  wie in Vanilla an die langsamste Einheit ihrer Gruppe an.
RunningUnits_Slaves: >-
  Bei „Ja“ laufen Sklaven immer, auch mit langsameren Einheiten in der Gruppe. Bei „Nein“ passen sie sich wie
  in Vanilla an die langsamste Einheit ihrer Gruppe an.
AIVTroops_InitialRole: >-
  Anfangszuweisung noch unzugeordneter Start- oder Szenariotruppen. Graben setzt tatsächliche Grabefähigkeit
  und Grabenfelder voraus; sonst wird Verteidigung verwendet.


  Gemeinsamer Standard aller unterstützten Truppen. Vanilla lässt dieses Feld beim Speichern weg und nutzt den
  nächsten passenden allgemeinen oder Menüstandard. Benötigt aiv-troops-behaviour mit aktivierten
  Truppeneinstellungen und AIC-Überschreibungen. Nach Änderungen UCP neu starten und eine neue Partie
  beginnen.
AIVTroops_Movement: >-
  Bewegung defensiver AIV-Einheitenplätze. Patrouille verwendet DefWallPatrolGroups und
  DefWallPatrolRallyTime; bei null Gruppen bleiben Einheiten stehen.


