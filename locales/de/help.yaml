  Steinbrüchen.
OuterPatrolRallyDelay: Wartezeit der Verteidiger außerhalb der Mauern, bevor sie zum nächsten Ort gehen.
DefWalls: >-
  Anzahl der Mauerverteidiger aus der Gesamtzahl der Verteidiger. Sie gehen zu ihren AIV-Plätzen in der Burg;
  die übrigen patrouillieren die Wirtschaft.
