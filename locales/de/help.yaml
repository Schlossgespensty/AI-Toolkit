CriticalPopularity: |-
  Unter dieser Beliebtheit verkauft die KI verstärkt Waren, um Gold zu erhalten.

  10000 = 100 Beliebtheit.
  5000 = 50 Beliebtheit.
LowestPopularity: >-
  Unter dieser Beliebtheit senkt die KI die Steuern in Richtung TaxesMin und gibt zusätzliche Rationen, bis
  HighestPopularity erreicht ist.


  10000 = 100 Beliebtheit.

  5000 = 50 Beliebtheit.
HighestPopularity: >-
  Über dieser Beliebtheit erhöht die KI die Steuern, bis ein stabiler Beliebtheitsmodifikator von bis zu −3
  erreicht ist.


  10000 = 100 Beliebtheit.

  5000 = 50 Beliebtheit.
TaxesMin: |-
  Niedrigste erlaubte Steuerstufe.
  0 = höchste Bestechung
  11 = höchste Steuern
TaxesMax: |-
  Höchste erlaubte Steuerstufe.
  0 = höchste Bestechung
  11 = höchste Steuern
