HarassingSiegeEnginesMax: Número máximo de máquinas de hostigamiento presentes a la vez en el campo.
RaidRetargetDelay: Tiempo de espera antes de elegir otro edificio como objetivo de la incursión.
AttForceBase: >-
  Número de unidades necesario para iniciar un ataque. Aumenta después de cada ataque según la opción de UCP;
  en el juego original aumenta en 5.
AttForceRandom: Unidades adicionales sobre AttForceBase cuando la IA se considera fuerte y rica.
AttForceSupportAllyThreshold: Número de tropas de ataque necesario para obedecer las órdenes «Atacar» o «Ayudar» del jugador.
AttForceRallyPercentage: Porcentaje del ejército que debe llegar al punto de reunión antes de comenzar el ataque.
Unknown129: >-
  Tiene muy poco efecto: porcentaje que debe llegar al punto de reunión antes de retirar un ataque débil y
  porcentaje de tropas en retirada que debe llegar a la torre del homenaje antes de reclutar el siguiente
  ataque.
AttAssaultDelay: >-
  Tiempo que esperan las unidades de ataque y las máquinas de asedio en el punto de reunión antes de avanzar
  al asalto.
AttUnitPatrolRecommandDelay: >-
  Tiempo de espera antes de retirarse tras ganar un ataque. Normalmente es 0, pues no hace falta permanecer
  junto a la tumba del enemigo.
Unknown132: >-
  Probabilidad porcentual de esperar el ataque de un aliado. Más adelante, la IA puede atacar sin haber
  completado el reclutamiento para unirse a un ataque aliado.
SiegeEngine1: Máquina de asedio 1 reclutada para el ataque.
SiegeEngine2: Máquina de asedio 2 reclutada para el ataque.
SiegeEngine3: Máquina de asedio 3 reclutada para el ataque.
