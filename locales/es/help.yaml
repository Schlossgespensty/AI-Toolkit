SiegeEngine6: Máquina de asedio 6 reclutada para el ataque.
SiegeEngine7: Máquina de asedio 7 reclutada para el ataque.
SiegeEngine8: Máquina de asedio 8 reclutada para el ataque. Se reclutan como máximo ocho máquinas.
CowThrowInterval: Número de piedras que lanza una catapulta antes de lanzar una vaca en su lugar.
Unknown142: Valor sin uso.
AttMaxEngineers: >-
  Número máximo de ingenieros que maneja las máquinas de los puestos SiegeEngine. Debe ser al menos la suma de
  los ingenieros necesarios para operar todas esas máquinas.
AttDiggingUnit: Tipo de unidad que rellena el foso enemigo durante un ataque.
AttDiggingUnitMax: Número máximo de excavadores reclutados por ataque.
AttUnitVanguard: Tipo de unidad que corre a atacar el castillo enemigo antes que las demás.
AttUnitVanguardMax: Número máximo de unidades de vanguardia reclutadas por ataque.
AttMaxAssassins: Número máximo de asesinos que intentan escalar las puertas enemigas durante un asedio.
AttMaxLaddermen: Número máximo de escaleros que intentan apoyar sus escaleras en una muralla durante un asedio.
AttMaxTunnelers: Número máximo de zapadores que intentan excavar hacia la torre del homenaje enemiga.
AttUnitPatrol: Unidades que patrullan alrededor del castillo enemigo y disparan a sus tropas.
AttUnitPatrolMax: Número máximo de unidades de patrulla reclutadas por ataque.
AttUnitPatrolGroupsCount: Número de grupos en que se dividen las patrullas al comenzar un ataque.
AttUnitBackup: >-
  Unidades que esperan en el punto de reunión y solo atacan cuando hay un camino a la torre del homenaje
  enemiga. Se retiran si mueren todos los demás atacantes.
AttUnitBackupMax: Número máximo de unidades de reserva reclutadas por ataque.
AttUnitBackupGroupsCount: Número de grupos en que se divide la reserva al atacar la torre del homenaje enemiga.
AttUnitEngage: Unidades que intentan atacar soldados y campesinos enemigos en lugar de murallas.
AttUnitEngageMax: Número máximo de unidades de enfrentamiento reclutadas por ataque.
AttUnitSiegeDef: >-
  Las escoltas de asedio permanecen junto a las máquinas durante un ataque. Pueden proteger tanto máquinas de
  ataque como de hostigamiento y defensa.
AttUnitSiegeDefMax: Número máximo de escoltas de asedio reclutadas por ataque.
AttUnitSiegeDefGroupsCount: Número de grupos en que se dividen las escoltas de asedio durante un ataque.
AttUnitMain1: >-
  Puesto 1 de la secuencia de reclutamiento del ejército principal. Solo estas unidades aumentan sin límite.
  Si no puede pagar una unidad, la IA intenta reclutar la siguiente.
AttUnitMain2: >-
  Puesto 2 de la secuencia de reclutamiento del ejército principal. Solo estas unidades aumentan sin límite.
  Si no puede pagar una unidad, la IA intenta reclutar la siguiente.
AttUnitMain3: >-
  Puesto 3 de la secuencia de reclutamiento del ejército principal. Solo estas unidades aumentan sin límite.
  Si no puede pagar una unidad, la IA intenta reclutar la siguiente.
AttUnitMain4: >-
  Puesto 4 de la secuencia de reclutamiento del ejército principal. Solo estas unidades aumentan sin límite.
  Si no puede pagar una unidad, la IA intenta reclutar la siguiente. Después de AttUnitMain4, vuelve al
  principio.
AttMaxDefault: >-
  Número de unidades del ejército principal que la IA puede reclutar antes de tener que completar todos los
  puestos especializados (AttLaddermen, AttAssassins, AttUnitPatrol, etc.). Con 0, debe completar todos los
  puestos especializados antes de reclutar cualquier AttUnitMain.
AttMainGroupsCount: Número de grupos en que se dividen las unidades AttUnitMain durante un ataque.
TargetChoice: >-
  Cómo elige la IA a quién atacar.


  Oro: al enemigo con más oro.


  Equilibrado: según una puntuación calculada de debilidad; es la opción más compleja y matizada.


  Más cercano: al enemigo cuya torre del homenaje esté más cerca.


  Cualquiera: al siguiente enemigo de la lista interna de jugadores. Puede parecer aleatorio, pero sigue un
  orden fijo.


  Jugador: da prioridad a los jugadores humanos. Si no hay enemigos humanos, usa «Más cercano».
AIOxTethers_DisableInitialOxTether: >-
  False conserva el comportamiento original; True impide construir un amarre de bueyes cada vez que se
  construye o reconstruye una cantera.
AIOxTethers_Logic: 'Lógica aplicada: False conserva la original; True usa la dinámica.'
AIOxTethers_MaxOxTethers: El número total de amarres de bueyes de esta IA nunca superará este valor.
AIOxTethers_DynamicMaxOxTethers: El número total de amarres de bueyes nunca superará este valor multiplicado por el número de canteras.
AIOxTethers_MinimumOxTethersPerQuarry: >-
  Si hay menos amarres vinculados transportando piedra de esta cantera que este valor, se construye otro para
  ella.
AIOxTethers_MaximumOxTethersPerQuarry: Si el número de amarres vinculados a una cantera supera este valor, no se construye otro para ella.
AIOxTethers_ThresholdStoneLoad: >-
  Si la cantidad de piedra dividida entre los amarres vinculados a una cantera supera este valor, se construye
  otro amarre para ella.
RunningUnits_Macemen: >-
  Si se activa, los soldados con maza siempre corren, incluso en grupos con unidades más lentas. Si se
  desactiva, igualan la velocidad de la unidad más lenta del grupo, como en el juego original.
RunningUnits_Spearmen: >-
  Si se activa, los lanceros siempre corren, incluso en grupos con unidades más lentas. Si se desactiva,
  igualan la velocidad de la unidad más lenta del grupo, como en el juego original.
RunningUnits_Slingers: >-
  Si se activa, los honderos siempre corren, incluso en grupos con unidades más lentas. Si se desactiva,
  igualan la velocidad de la unidad más lenta del grupo, como en el juego original.
RunningUnits_Slaves: >-
  Si se activa, los esclavos siempre corren, incluso en grupos con unidades más lentas. Si se desactiva,
  igualan la velocidad de la unidad más lenta del grupo, como en el juego original.
AIVTroops_InitialRole: >-
  Asignación inicial de las tropas de inicio o escenario sin tarea. Excavar requiere que puedan excavar y que
  existan casillas de foso; si no, se asignan a defensa.


  Valor común para todas las tropas compatibles. Vanilla omite este campo al guardar el personaje y usa el
  siguiente valor común o de menú aplicable. Requiere aiv-troops-behaviour con «Ajustes de tropas» y «Usar
  ajustes del AIC» activados. Reinicia UCP e inicia una partida nueva tras cambiarlo.
AIVTroops_Movement: >-
  Movimiento defensivo entre los puestos del AIV. La patrulla usa DefWallPatrolGroups y
  DefWallPatrolRallyTime; con cero grupos, las tropas permanecen quietas.


  Valor común para todas las tropas compatibles. Vanilla omite este campo al guardar el personaje y usa el
  siguiente valor común o de menú aplicable. Requiere aiv-troops-behaviour con «Ajustes de tropas» y «Usar
  ajustes del AIC» activados. Reinicia UCP e inicia una partida nueva tras cambiarlo.
