SortieUnitRangedMin: >-
  Número mínimo de unidades de salida a distancia.


  Débil casi nunca se activa, normalmente solo al borde de la derrota. Normal suele usarse durante los
  primeros años. Fuerte es el estado más habitual; se alcanza con frecuencia cuando la población y el número
  de unidades superan 40.
SortieUnitRanged: >-
  Tipo de unidad de salida a distancia. Se reúne fuera del castillo, donde murieron trabajadores. Su número
  aumenta cuando mueren unidades y más tarde suele superar el mínimo en unas 25. Se reclutan incluso con un
  mínimo de 0; para desactivarlas, elige un tipo que no pueda reclutarse. Las salidas tienen prioridad sobre
  cualquier otro reclutamiento.
SortieUnitMeleeMin: Número exacto de unidades de salida cuerpo a cuerpo.
SortieUnitMelee: >-
  Tipo de unidad de salida cuerpo a cuerpo. Intercepta tropas que destruyen edificios y regresa a lo alto de
  la torre del homenaje cuando muere su objetivo. Las salidas tienen prioridad sobre cualquier otro
  reclutamiento.
DefDiggingUnitMax: >-
  Número máximo de excavadores. Mientras haya un foso propio o aliado pendiente de excavar, se reclutan antes
  que las unidades de defensa, incursión y ataque.
DefDiggingUnit: Tipo de unidad que excava los fosos defensivos propios y aliados.
RecruitInterval: >-
  Tiempo de espera entre reclutamientos en el estado normal. 1 es la velocidad máxima.


  Débil casi nunca se activa, normalmente solo al borde de la derrota. Normal suele usarse durante los
  primeros años. Fuerte es el estado más habitual; se alcanza con frecuencia cuando la población y el número
