StrengthMultiplier: |-
  Multiplica los puntos de vida del señor.
  Rata = 0.5
  Normal = 1
  Lobo = 1.5
DotColour: >-
  Color de los puntos que indican la fuerza del señor. En el juego original, amarillo indica debilidad y azul
  indica fuerza.
DotCount: Número de puntos que indican la fuerza del señor; un punto por cada 0.1 del multiplicador.
Type: Tipo de señor que aparece en la torre del homenaje.
ArabArcher: Número de arqueros árabes que aparecen junto a la torre del homenaje al comenzar la partida.
Slave: Número de esclavos que aparecen junto a la torre del homenaje al comenzar la partida.
Slinger: Número de honderos que aparecen junto a la torre del homenaje al comenzar la partida.
Assassin: Número de asesinos que aparecen junto a la torre del homenaje al comenzar la partida.
HorseArcher: Número de arqueros a caballo que aparecen junto a la torre del homenaje al comenzar la partida.
ArabSwordsman: Número de espadachines árabes que aparecen junto a la torre del homenaje al comenzar la partida.
FireThrower: Número de lanzafuegos que aparecen junto a la torre del homenaje al comenzar la partida.
EuropArcher: Número de arqueros europeos que aparecen junto a la torre del homenaje al comenzar la partida.
Spearman: Número de lanceros que aparecen junto a la torre del homenaje al comenzar la partida.
Maceman: Número de soldados con maza que aparecen junto a la torre del homenaje al comenzar la partida.
Crossbowman: Número de ballesteros que aparecen junto a la torre del homenaje al comenzar la partida.
Pikeman: Número de piqueros que aparecen junto a la torre del homenaje al comenzar la partida.
Swordsman: Número de espadachines que aparecen junto a la torre del homenaje al comenzar la partida.
Knight: Número de caballeros que aparecen junto a la torre del homenaje al comenzar la partida.
Monk: Número de monjes que aparecen junto a la torre del homenaje al comenzar la partida.
WallDecoration: |-
  Decoración que usa el señor al colocar una bandera en el editor AIV.

  8 = aceite ardiendo al verterse
  9 = llamas
  10 = bandera pequeña
  11 = bandera grande
  12 = bandera mediana
  13 = bandera cruzada
  14 = braseros
  15 = calaveras decorativas
  21 = nubes de vapor
  22 = nubes de enfermedad
  26 = explosiones de fuego
  28 = cuervos descendiendo
  29 = piedras medianas cayendo al agua
  30 = piedras pequeñas impactando en estructuras
  31 = piedras pequeñas cayendo al agua
  40 = indicador ascendente de cero de oro
  41 = indicador ascendente de cero de popularidad
  42 = indicador ascendente vacío
  43 = indicador ascendente vacío
Unknown001: Valor sin uso.
Unknown002: Valor sin uso.
Unknown003: Valor sin uso.
Unknown004: Valor sin uso.
Unknown005: Valor sin uso.
CriticalPopularity: >-
  Por debajo de esta popularidad, la IA vende recursos de forma agresiva para obtener oro. 10000 equivale a
  100 de popularidad; 5000 equivale a 50.
LowestPopularity: >-
  Por debajo de esta popularidad, la IA baja los impuestos a TaxesMin y ofrece raciones adicionales hasta
  alcanzar HighestPopularity. 10000 equivale a 100 de popularidad; 5000 equivale a 50.
HighestPopularity: >-
  Por encima de esta popularidad, la IA sube los impuestos hasta estabilizar el modificador de popularidad,
  permitiendo hasta −3. 10000 equivale a 100 de popularidad; 5000 equivale a 50.
TaxesMin: Nivel mínimo de impuestos permitido. 0 ofrece los mayores sobornos; 11 aplica los impuestos más altos.
TaxesMax: Nivel máximo de impuestos permitido. 0 ofrece los mayores sobornos; 11 aplica los impuestos más altos.
Unknown011: Valor sin uso.
Farm1: >-
  Granja 1 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo.
Farm2: >-
  Granja 2 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo.
Farm3: >-
  Granja 3 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo.
Farm4: >-
  Granja 4 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo.
Farm5: >-
  Granja 5 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo.
Farm6: >-
  Granja 6 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo.
Farm7: >-
  Granja 7 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo.
Farm8: >-
  Granja 8 de la secuencia de construcción. Al destruirse una granja, se construye la siguiente de la lista,
  no necesariamente otra del mismo tipo. Después de Farm8, la secuencia vuelve al principio.
PopulationPerFarm: >-
  La IA construye una granja por esta cantidad de capacidad de población. La primera se construye incluso con
  una capacidad de 0. Las granjas de lúpulo no cuentan para este límite; se construyen cuando les toca en la
  secuencia de granjas.
PopulationPerWoodcutter: >-
  La IA construye una cabaña de leñador por esta cantidad de capacidad de población. Al alcanzar el primer
  umbral, construye dos.
PopulationPerQuarry: >-
  La IA construye una cantera por esta cantidad de capacidad de población. Al alcanzar el primer umbral,
  construye dos.
PopulationPerIronmine: >-
  La IA construye una mina de hierro por esta cantidad de capacidad de población. Al alcanzar el primer
  umbral, construye dos.
PopulationPerPitchrig: La IA construye un pozo de brea por esta cantidad de capacidad de población.
MaxQuarries: Número máximo de canteras que construye la IA.
MaxIronmines: Número máximo de minas de hierro que construye la IA.
MaxWoodcutters: Número máximo de cabañas de leñador que construye la IA.
MaxPitchrigs: Número máximo de pozos de brea que construye la IA.
MaxFarms: Número máximo de granjas que construye la IA. Las granjas de lúpulo no cuentan para este límite.
BuildInterval: >-
  Intervalo entre construcciones de la IA, tanto dentro como fuera del AIV, incluidas las reparaciones. 1 es
  la velocidad máxima.
ResourceRebuildDelay: Tiempo de espera antes de intentar reconstruir un edificio de recursos que no está definido en el AIV.
MaxFood: >-
  Cantidad máxima de cada alimento (manzanas, queso, carne, pan y trigo), más MaxResourceVariance. El límite
  se aplica a cada recurso por separado, no a su suma.
MinimumApples: >-
  Si hay menos manzanas que esta cantidad, la IA compra lotes de TradeAmountFood hasta alcanzar el umbral. 0
  significa que nunca compra manzanas.
MinimumCheese: >-
  Si hay menos queso que esta cantidad, la IA compra lotes de TradeAmountFood hasta alcanzar el umbral. 0
  significa que nunca compra queso.
MinimumBread: >-
  Si hay menos pan que esta cantidad, la IA compra lotes de TradeAmountFood hasta alcanzar el umbral. 0
  significa que nunca compra pan. Con una economía de pan, puede convenir dejarlo en 0 y comprar trigo.
MinimumWheat: >-
  Si hay menos trigo que esta cantidad, la IA compra lotes de TradeAmountFood hasta alcanzar el umbral. 0
  significa que nunca compra trigo.
MinimumHop: >-
  Si hay menos lúpulo que esta cantidad, la IA compra lotes de TradeAmountFood hasta alcanzar el umbral. 0
  significa que nunca compra lúpulo.
TradeAmountFood: >-
  Cantidad de alimento comprada en cada operación; solo se compra un tipo a la vez. Un valor bajo permite
  compras más baratas y fiables, pero requiere más operaciones, repone las existencias más despacio y puede
  causar breves carencias.
TradeAmountEquipment: >-
  Cantidad de equipo comprada en cada operación; solo se compra un tipo a la vez. Un valor bajo permite
  compras más baratas y fiables, pero requiere más operaciones, repone las existencias más despacio y puede
  causar breves carencias.
AIRequestDelay: >-
  Intervalo entre las peticiones de recursos de la IA al jugador. Un valor menor hace que las peticiones sean
  más frecuentes.
MinimumGoodsRequiredAfterTrade: >-
  Cantidad que debe quedarle a la IA después de un intercambio para que acepte la petición. De lo contrario,
  la rechaza.
DoubleRationsFoodThreshold: La IA ofrece raciones dobles cuando la suma de manzanas, queso, carne y pan supera este umbral.
MaxWood: Cantidad máxima de madera, más MaxResourceVariance.
MaxStone: Cantidad máxima de piedra, más MaxResourceVariance.
MaxResourceOther: >-
  Cantidad máxima de hierro, brea, lúpulo y harina, más MaxResourceVariance. Se aplica a cada recurso por
  separado, no a su suma.
MaxEquipment: >-
  Cantidad máxima de cada arma o armadura, más MaxResourceVariance. Se aplica a cada tipo por separado, no a
  su suma.
MaxBeer: Cantidad máxima de cerveza, más MaxResourceVariance.
MaxResourceVariance: Desviación permitida sobre cualquiera de los límites máximos de recursos.
RecruitGoldThreshold: Cantidad mínima de oro necesaria antes de reclutar unidades.
BlacksmithSetting: 'Producción de la herrería. «Ambos» alterna entre espadas y mazas: espada, maza, espada…'
FletcherSetting: 'Producción del fabricante de arcos. «Ambos» alterna entre arcos y ballestas: arco, ballesta, arco…'
PoleturnerSetting: 'Producción del taller de lanzas. «Ambos» alterna entre lanzas y picas: lanza, pica, lanza…'
SellResource01: Este recurso se vende inmediatamente en cuanto se obtiene.
