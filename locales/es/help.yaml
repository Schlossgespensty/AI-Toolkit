HarassingSiegeEngine1: >-
  Máquina de hostigamiento 1 de la secuencia de reclutamiento. Viaja desde el gremio de ingenieros al castillo
  enemigo y dispara a edificios por el camino. Las balistas de fuego también atacan unidades.
