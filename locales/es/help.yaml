DefWallPatrolRallyTime: >-
  Tiempo de espera antes de que las unidades de muralla caminen al siguiente puesto del AIV. No todos los
  tipos de unidad pueden patrullar murallas.
DefWallPatrolGroups: Número de grupos de muralla que patrullan los puestos del AIV.
DefSiegeEngineGoldThreshold: Cantidad de oro necesaria antes de construir las máquinas de asedio definidas en el AIV.
DefSiegeEngineBuildDelay: >-
  Tiempo de espera antes de reconstruir una máquina de asedio del AIV destruida. Un valor menor la repone
  antes.
Unknown072: Valor sin uso.
Unknown073: Valor sin uso.
RecruitProbDefDefault: >-
  Probabilidad de reclutar unidades de defensa en el estado normal.


  Débil casi nunca se activa, normalmente solo al borde de la derrota. Normal suele usarse durante los
  primeros años. Fuerte es el estado más habitual; se alcanza con frecuencia cuando la población y el número
  de unidades superan 40.
RecruitProbDefWeak: >-
