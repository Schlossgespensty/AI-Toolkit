DefTotal: Número total de unidades defensivas.
OuterPatrolGroupsCount: Número de grupos defensivos que patrullan la zona económica.
OuterPatrolGroupsMove: >-
  Indica si los defensores que no están en las murallas patrullan la zona económica o permanecen quietos,
  normalmente cerca de las canteras.
OuterPatrolRallyDelay: Tiempo de espera de los defensores exteriores antes de ir al siguiente punto de patrulla.
DefWalls: >-
  Número de unidades de DefTotal asignadas a los puestos de muralla del AIV. Las restantes patrullan la zona
  económica.
DefUnit1: >-
  Puesto 1 de la secuencia de reclutamiento de defensa. Si no puede pagar una unidad, la IA intenta reclutar
  la siguiente de la lista.
DefUnit2: >-
