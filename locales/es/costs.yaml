work_ticks_exclude_the_return_journey_cycle_work_ticks_2_distance_walkin: >-
  Los ticks de trabajo excluyen el regreso: ciclo = trabajo + 2 × distancia × ticks caminando. Cada productor
  conserva su progreso y bonificación fraccionaria. La piedra es la producción de la cantera; no se simula el
  transporte de bueyes. Las distancias de la capa de rutas son diagnósticos de distribución, no distancias
  medidas a recursos externos.
