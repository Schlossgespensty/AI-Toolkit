work_ticks_exclude_the_return_journey_cycle_work_ticks_2_distance_walkin: >-
  Время работы не включает обратный путь: цикл = рабочие такты + 2 × расстояние × такты ходьбы. У каждого
  производителя собственный прогресс и дробный бонус доставки. Камень означает выпуск каменоломни; перевозка
  волами не моделируется. Расстояния наложения путей — отдельная диагностика планировки, не измеренные
  расстояния до внешних ресурсов.
