reference_estimate_from_stronghold_heaven_original_stronghold_assuming_f: >-
  Справочная оценка Stronghold Heaven (оригинальный Stronghold), предполагающая полную занятость при появлении
  жилья. Эти приблизительные скорости не проверены как точные времена симуляции Crusader. Не учитываются
  задержки строительства, паузы, нехватка сырья, потребление, торговля, транспортные ограничения, страх и
  отдых. Это не текущие запасы на складе.
