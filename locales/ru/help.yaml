HarassingSiegeEnginesMax: Максимальное число машин для обстрела, одновременно находящихся на поле.
RaidRetargetDelay: Время ожидания войск набега перед выбором нового здания-цели.
AttForceBase: >-
  Число бойцов, которое ИИ набирает перед атакой противника. Увеличивается после каждой атаки согласно
  настройкам UCP; в оригинале — на 5 за атаку.
AttForceRandom: Сколько бойцов ИИ может добавить сверх AttForceBase, если считает себя сильным и имеет много золота.
AttForceSupportAllyThreshold: Число атакующих бойцов, которое нужно набрать перед выполнением команд игрока «Атаковать» или «Помочь».
AttForceRallyPercentage: Доля бойцов в процентах, которая должна собраться в точке сбора до начала атаки ИИ.
Unknown129: >-
  Почти не влияет. Доля бойцов в процентах, которая должна дойти до точки сбора, прежде чем ИИ отступит, если
  атака признана слишком слабой для нанесения урона.


  Также доля отступающих, которая должна вернуться к цитадели до начала набора новой атаки.
AttAssaultDelay: >-
  Время ожидания атакующих войск и осадных машин в точке сбора после начала атаки, прежде чем их отправят в
  бой.
AttUnitPatrolRecommandDelay: |-
  Время ожидания ИИ перед отступлением после успешной атаки.

  Обычно стоит оставить 0: нет смысла ждать у могилы противника.
Unknown132: >-
  Вероятность в процентах, что ИИ отложит атаку, чтобы атаковать вместе с союзником. На поздних этапах это
  также может заставить ИИ присоединиться к атаке союзника до набора полной армии.
SiegeEngine1: Осадная машина №1, нанимаемая ИИ для атак.
SiegeEngine2: Осадная машина №2, нанимаемая ИИ для атак.
SiegeEngine3: Осадная машина №3, нанимаемая ИИ для атак.
SiegeEngine4: Осадная машина №4, нанимаемая ИИ для атак.
SiegeEngine5: Осадная машина №5, нанимаемая ИИ для атак.
SiegeEngine6: Осадная машина №6, нанимаемая ИИ для атак.
SiegeEngine7: Осадная машина №7, нанимаемая ИИ для атак.
SiegeEngine8: |-
  Осадная машина №8, нанимаемая ИИ для атак.

  Одновременно допускается не более восьми атакующих осадных машин.
CowThrowInterval: Сколько камней катапульта должна выпустить, прежде чем вместо камня бросить корову.
Unknown142: Неиспользуемое значение.
AttMaxEngineers: >-
  Максимум инженеров для осадных машин в слотах SiegeEngine. Число должно быть не меньше суммарной потребности
  этих машин в расчетах.
AttDiggingUnit: Тип бойца, закапывающего вражеский ров при атаке.
AttDiggingUnitMax: Максимум землекопов на одну атаку.
AttUnitVanguard: Тип бойца, который бежит атаковать вражеский замок раньше остальных.
AttUnitVanguardMax: Максимум бойцов авангарда на одну атаку.
AttMaxAssassins: Максимум ассасинов, пытающихся взобраться на вражеские ворота при осаде.
AttMaxLaddermen: Максимум лестничников, приставляющих лестницы к стенам при осаде.
AttMaxTunnelers: Максимум подкопщиков, прокладывающих тоннель к вражеской цитадели.
AttUnitPatrol: Войска, патрулирующие вокруг вражеского замка и обстреливающие противника.
AttUnitPatrolMax: Максимум бойцов патруля на одну атаку.
AttUnitPatrolGroupsCount: Число групп, на которые делится патруль в начале атаки.
AttUnitBackup: >-
  Войска, остающиеся в точке сбора и атакующие лишь при наличии пути к вражеской цитадели. Если остальные
  атакующие погибнут, они отступят.
AttUnitBackupMax: Максимум резервных бойцов на одну атаку.
AttUnitBackupGroupsCount: Число групп резерва при атаке вражеской цитадели.
AttUnitEngage: Бойцы, предпочитающие атаковать вражеских воинов и крестьян, а не стены.
AttUnitEngageMax: Максимум бойцов нападения на одну атаку.
AttUnitSiegeDef: >-
  Защитники осадных машин остаются с ними во время атаки. Они могут сопровождать не только атакующие, но и
  обстреливающие или защитные машины.
AttUnitSiegeDefMax: Максимум защитников осадных машин на одну атаку.
AttUnitSiegeDefGroupsCount: Число групп защитников осадных машин во время атаки.
AttUnitMain1: >-
  Тип бойцов №1, нанимаемых ИИ в основную атакующую группу. Только эти войска могут неограниченно расти в
  числе.


  Если на тип не хватает средств, ИИ пробует следующий по очереди.
