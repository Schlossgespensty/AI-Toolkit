SellResource05: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource06: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource07: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource08: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource09: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource10: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource11: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource12: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource13: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource14: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource15: Ресурс, который ИИ всегда немедленно продает при получении.
DefWallPatrolRallyTime: >-
  Время ожидания защитников стен перед переходом к следующей точке AIV. Не все типы защитников стен умеют
  патрулировать.
DefWallPatrolGroups: Сколько групп защитников стен патрулирует между точками AIV.
DefSiegeEngineGoldThreshold: Количество золота, необходимое ИИ для постройки осадных машин AIV.
DefSiegeEngineBuildDelay: Время ожидания ИИ перед восстановлением уничтоженных осадных машин AIV. Меньше значение — короче ожидание.
Unknown072: Неиспользуемое значение.
Unknown073: Неиспользуемое значение.
RecruitProbDefDefault: |-
  Вероятность найма защитников ИИ в обычном состоянии.

  Слабое: почти не активно, обычно перед поражением.
  Обычное: в основном первые несколько лет игры.
  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
RecruitProbDefWeak: |-
  Вероятность найма защитников ИИ в слабом состоянии.

  Слабое: почти не активно, обычно перед поражением.
  Обычное: в основном первые несколько лет игры.
  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
