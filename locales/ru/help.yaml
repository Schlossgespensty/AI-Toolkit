  самого медленного бойца в группе, как в оригинале.
AIVTroops_InitialRole: >-
  Начальная роль свободных стартовых войск или войск сценария. Рытье требует действительной способности копать
  и наличия клеток рва; иначе используется защита.


  Общее значение для всех поддерживаемых типов войск. Стандартное значение пропускает это поле при сохранении
  персонажа и использует следующее подходящее общее значение или настройку меню. Требуется
  aiv-troops-behaviour с включенными Troop settings и Use AIC overrides. После изменений перезапустите UCP и
  начните новый матч.
AIVTroops_Movement: >-
  Передвижение между защитными точками AIV. Патруль использует DefWallPatrolGroups и DefWallPatrolRallyTime;
  при нуле групп войска стоят на месте.


  Общее значение для всех поддерживаемых типов войск. Стандартное значение пропускает это поле при сохранении
