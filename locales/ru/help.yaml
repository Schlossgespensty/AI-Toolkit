  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
Farm5: |-
  Ферма №5 в очереди строительства ИИ.

  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
Farm6: |-
  Ферма №6 в очереди строительства ИИ.

  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
Farm7: |-
  Ферма №7 в очереди строительства ИИ.

  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
Farm8: |-
  Ферма №8 в очереди строительства ИИ. После Farm8 очередь начинается заново.

  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
PopulationPerFarm: |-
  На каждые столько мест для жителей ИИ строит одну ферму. Первая ферма всегда строится при населении 0.

  Хмелевые фермы не учитываются и строятся, как только до них доходит очередь.
PopulationPerWoodcutter: >-
  На каждые столько мест для жителей ИИ строит одного лесоруба. При первом достижении этого количества вместо
  одного строятся два.
PopulationPerQuarry: >-
  На каждые столько мест для жителей ИИ строит одну каменоломню. При первом достижении этого количества вместо
  одной строятся две.
PopulationPerIronmine: >-
  На каждые столько мест для жителей ИИ строит один железный рудник. При первом достижении этого количества
  вместо одного строятся два.
PopulationPerPitchrig: На каждые столько мест для жителей ИИ строит одну смоляную яму.
MaxQuarries: Максимальное число каменоломен, которое построит ИИ.
MaxIronmines: Максимальное число железных рудников, которое построит ИИ.
MaxWoodcutters: Максимальное число лесорубов, которое построит ИИ.
MaxPitchrigs: Максимальное число смоляных ям, которое построит ИИ.
MaxFarms: |-
  Максимальное число ферм, которое построит ИИ.

  Хмелевые фермы не учитываются.
BuildInterval: |-
  Скорость строительства ИИ. Относится ко всему: зданиям AIV, другим зданиям и любому ремонту.

  1 — самая высокая скорость.
ResourceRebuildDelay: Время ожидания ИИ перед попыткой восстановить производственное здание вне AIV.
MaxFood: |-
  Максимальные запасы яблок, сыра, мяса, хлеба и пшеницы (плюс ResourceVariance).

  Лимит действует на каждый вид отдельно, а не на сумму.
MinimumApples: >-
  Когда запас яблок падает ниже этого значения, ИИ покупает партии [TradeAmountFood], пока запас не
  восстановится.


  При 0 этот товар никогда не покупается.
MinimumCheese: >-
  Когда запас сыра падает ниже этого значения, ИИ покупает партии [TradeAmountFood], пока запас не
  восстановится.


  При 0 этот товар никогда не покупается.
MinimumBread: >-
  Когда запас хлеба падает ниже этого значения, ИИ покупает партии [TradeAmountFood], пока запас не
  восстановится.


  При 0 этот товар никогда не покупается.


  В хлебной экономике может быть выгоднее оставить 0 и покупать пшеницу.
MinimumWheat: >-
  Когда запас пшеницы падает ниже этого значения, ИИ покупает партии [TradeAmountFood], пока запас не
  восстановится.


  При 0 этот товар никогда не покупается.
MinimumHop: >-
  Когда запас хмеля падает ниже этого значения, ИИ покупает партии [TradeAmountFood], пока запас не
  восстановится.


  При 0 этот товар никогда не покупается.
TradeAmountFood: >-
  Количество пищи, покупаемое ИИ за раз. Одновременно покупается только один вид пищи.


  Малое значение удешевляет отдельную покупку (она вероятнее состоится), но может увеличить число покупок:
  запасы восстанавливаются медленнее, возможен краткий дефицит.
TradeAmountEquipment: >-
  Количество оружия, покупаемое ИИ за раз. Одновременно покупается только один вид снаряжения.


  Малое значение удешевляет отдельную покупку (она вероятнее состоится), но может увеличить число покупок:
  оружие пополняется медленнее, возможен краткий дефицит.
AIRequestDelay: |-
  Частота запросов ресурсов у игрока.
  Меньше значение — чаще запросы.
MinimumGoodsRequiredAfterTrade: >-
  Чтобы согласиться на торговлю с игроком, ИИ должен сохранить не меньше этого количества ресурса после
  сделки. Иначе он откажется.
DoubleRationsFoodThreshold: Если суммарный запас яблок, сыра, мяса и хлеба выше этого значения, ИИ дает двойной паек.
MaxWood: Максимальный запас дерева (плюс ResourceVariance).
MaxStone: Максимальный запас камня (плюс ResourceVariance).
MaxResourceOther: |-
  Максимальные запасы железа, смолы, хмеля и муки (плюс ResourceVariance).

  Лимит действует на каждый вид отдельно, а не на сумму.
MaxEquipment: >-
  Максимальные запасы оружия и доспехов (плюс ResourceVariance). Лимит действует на каждый вид отдельно, а не
  на сумму.
MaxBeer: Максимальный запас эля (плюс ResourceVariance).
MaxResourceVariance: Допустимое отклонение от любого значения Max[Resource].
RecruitGoldThreshold: Минимальное количество золота, необходимое ИИ для начала найма войск.
BlacksmithSetting: >-
  Определяет режимы кузниц ИИ. При выборе «Оба» первая производит мечи, вторая — булавы, третья — мечи и так
  далее.
FletcherSetting: >-
  Определяет режимы лучных мастерских ИИ. При выборе «Оба» первая производит луки, вторая — арбалеты, третья —
  луки и так далее.
PoleturnerSetting: >-
  Определяет режимы копейных мастерских ИИ. При выборе «Оба» первая производит копья, вторая — пики, третья —
  копья и так далее.
SellResource01: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource02: Ресурс, который ИИ всегда немедленно продает при получении.
SellResource03: Ресурс, который ИИ всегда немедленно продает при получении.
