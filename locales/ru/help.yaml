  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
RecruitProbAttackStrong: |-
  Вероятность найма атакующих ИИ в сильном состоянии.

  Слабое: почти не активно, обычно перед поражением.
  Обычное: в основном первые несколько лет игры.
  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
SortieUnitRangedMin: |-
  Минимальное число стрелков, отправляемых ИИ на вылазку.

  Слабое: почти не активно, обычно перед поражением.
  Обычное: в основном первые несколько лет игры.
  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
SortieUnitRanged: >-
  Тип стрелков для вылазок. Они занимают места вне замка, где погибли работники. Чем чаще их убивают, тем
  больше их нанимается. Позднее в игре их обычно примерно на 25 больше заданного значения.


  Нанимаются даже при 0; для отключения выберите тип, который нельзя нанять.


  Войска вылазок всегда нанимаются раньше всех остальных.
SortieUnitMeleeMin: Точное число бойцов ближнего боя, отправляемых ИИ на вылазку.
SortieUnitMelee: |-
  Тип бойцов вылазки для перехвата войск, разрушающих здания. После гибели цели возвращаются на верх цитадели.

  Войска вылазок всегда нанимаются раньше всех остальных.
DefDiggingUnitMax: >-
  Максимальное число нанимаемых землекопов. Пока ИИ или союзник планирует ров, землекопы нанимаются раньше
  защитников, войск набега и атакующих.
DefDiggingUnit: Тип войск для рытья защитного рва ИИ или союзника.
RecruitInterval: |-
  Время ожидания ИИ перед наймом следующего бойца в обычном состоянии. 1 — быстрее всего.

  Слабое: почти не активно, обычно перед поражением.
  Обычное: в основном первые несколько лет игры.
  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
RecruitIntervalWeak: |-
  Время ожидания ИИ перед наймом следующего бойца в слабом состоянии. 1 — быстрее всего.

  Слабое: почти не активно, обычно перед поражением.
  Обычное: в основном первые несколько лет игры.
  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
RecruitIntervalStrong: |-
  Время ожидания ИИ перед наймом следующего бойца в сильном состоянии. 1 — быстрее всего.

  Слабое: почти не активно, обычно перед поражением.
  Обычное: в основном первые несколько лет игры.
  Сильное: активно чаще всего; часто достигается уже при населении и числе войск больше 40.
DefTotal: Общее число защитников, нанимаемых ИИ.
OuterPatrolGroupsCount: Число групп защитников, патрулирующих хозяйственные постройки.
OuterPatrolGroupsMove: >-
  Патрулируют ли защитники, кроме защитников стен, хозяйственные постройки или стоят на месте (часто у
  каменоломен).
OuterPatrolRallyDelay: Время ожидания защитников, кроме защитников стен, перед переходом к следующей позиции.
DefWalls: >-
  Сколько бойцов из общего числа защитников охраняют стены. Они идут к точкам AIV в замке; остальные
  патрулируют хозяйственные постройки.
DefUnit1: |-
  Тип защитников №1, который ИИ пытается нанять.

  Если на этот тип не хватает средств, ИИ пробует следующий по очереди.
