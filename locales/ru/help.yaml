AttMaxDefault: >-
  Сколько бойцов основной армии ИИ МОЖЕТ нанять до полного набора ВСЕХ специальных ролей (AttLaddermen,
  AttAssassins, AttUnitPatrol и других). При 0 сначала нанимаются все специальные роли, и лишь затем
  AttUnitMain.
AttMainGroupsCount: Число групп войск AttUnitMain во время атаки.
TargetChoice: |-
  Способ выбора цели атаки.

  Золото: всегда атакует врага с наибольшим запасом золота.

  Сбалансированно: выбирает врага по расчетному показателю слабости. Это самый сложный и гибкий вариант.

  Ближайший: всегда атакует ближайшего врага по расстоянию между цитаделями.

  Любой: атакует следующего врага во внутреннем списке игроков. Кажется случайным, но порядок фиксирован.

  Игрок: в первую очередь атакует человека. Если среди врагов нет людей, выбирает ближайшего.
AIOxTethers_DisableInitialOxTether: >-
  False: исходное поведение. True: не строить привязь вола при каждой постройке или восстановлении
  каменоломни.
AIOxTethers_Logic: |-
  Выбор логики.
  False — исходная, True — динамическая.
AIOxTethers_MaxOxTethers: Общее число привязей волов этого ИИ никогда не превысит это значение.
AIOxTethers_DynamicMaxOxTethers: Общее число привязей волов этого ИИ никогда не превысит это значение, умноженное на число каменоломен.
AIOxTethers_MinimumOxTethersPerQuarry: >-
  Если камень из каменоломни забирает меньше связанных привязей волов, чем задано, для нее строится еще одна
  привязь.
AIOxTethers_MaximumOxTethersPerQuarry: Если число привязей волов, связанных с каменоломней, выше заданного, новые привязи для нее не строятся.
AIOxTethers_ThresholdStoneLoad: Если отношение «камень / связанные привязи волов» у каменоломни выше заданного, строится еще одна привязь.
RunningUnits_Macemen: >-
  Если True, дубинщики всегда бегут, даже в группе с более медленными бойцами. Если False, подстраиваются под
  самого медленного бойца в группе, как в оригинале.
RunningUnits_Spearmen: >-
  Если True, копейщики всегда бегут, даже в группе с более медленными бойцами. Если False, подстраиваются под
  самого медленного бойца в группе, как в оригинале.
RunningUnits_Slingers: >-
