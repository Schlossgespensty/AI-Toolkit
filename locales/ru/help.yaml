StrengthMultiplier: |-
  Множитель здоровья лорда.
  Крыса = 0.5
  Стандарт = 1
  Волк = 1.5
DotColour: |-
  Цвет точек, обозначающих силу лорда.
  В оригинале желтый используется для слабых ИИ, синий — для сильных.
DotCount: |-
  Количество точек, обозначающих силу лорда.
  В оригинале одна точка соответствует 0.1 множителя.
Type: Тип лорда, появляющегося в цитадели.
ArabArcher: Число бойцов типа «Арабский лучник», появляющихся возле цитадели в начале игры.
Slave: Число бойцов типа «Раб», появляющихся возле цитадели в начале игры.
Slinger: Число бойцов типа «Пращник», появляющихся возле цитадели в начале игры.
Assassin: Число бойцов типа «Ассасин», появляющихся возле цитадели в начале игры.
HorseArcher: Число бойцов типа «Конный лучник», появляющихся возле цитадели в начале игры.
ArabSwordsman: Число бойцов типа «Арабский мечник», появляющихся возле цитадели в начале игры.
FireThrower: Число бойцов типа «Огнеметатель», появляющихся возле цитадели в начале игры.
EuropArcher: Число бойцов типа «Европейский лучник», появляющихся возле цитадели в начале игры.
Spearman: Число бойцов типа «Копейщик», появляющихся возле цитадели в начале игры.
Maceman: Число бойцов типа «Дубинщик», появляющихся возле цитадели в начале игры.
Crossbowman: Число бойцов типа «Арбалетчик», появляющихся возле цитадели в начале игры.
Pikeman: Число бойцов типа «Пикинер», появляющихся возле цитадели в начале игры.
Swordsman: Число бойцов типа «Мечник», появляющихся возле цитадели в начале игры.
Knight: Число бойцов типа «Рыцарь», появляющихся возле цитадели в начале игры.
Monk: Число бойцов типа «Монах», появляющихся возле цитадели в начале игры.
WallDecoration: |-
  Украшение, используемое лордом для меток flg в редакторе AIV.

  8 = горящее льющееся масло
  9 = пламя
  10 = малый флаг
  11 = большой флаг
  12 = средний флаг
  13 = флаг крестоносцев
  14 = жаровни
  15 = декоративные черепа
  21 = клубы пара
  22 = облака болезни
  26 = огненные взрывы
  28 = слетающиеся вороны
  29 = средние камни, падающие в воду
  30 = малые камни, попадающие в сооружения
  31 = малые камни, падающие в воду
  40 = всплывающая надпись нулевого золота
  41 = всплывающая надпись нулевой популярности
  42 = пустая всплывающая надпись
  43 = пустая всплывающая надпись
Unknown001: Неиспользуемое значение.
Unknown002: Неиспользуемое значение.
Unknown003: Неиспользуемое значение.
Unknown004: Неиспользуемое значение.
Unknown005: Неиспользуемое значение.
CriticalPopularity: |-
  Ниже этой популярности ИИ активно продает товары для получения золота.

  10000 = 100 популярности.
  5000 = 50 популярности.
LowestPopularity: |-
  Ниже этой популярности ИИ снижает налоги к TaxesMin и увеличивает паек, пока не достигнет HighestPopularity.

  10000 = 100 популярности.
  5000 = 50 популярности.
HighestPopularity: |-
  Выше этой популярности ИИ повышает налоги, пока не получит стабильный модификатор популярности до −3.

  10000 = 100 популярности.
  5000 = 50 популярности.
TaxesMin: |-
  Минимальный разрешенный уровень налогов.
  0 = наибольшие подачки
  11 = наивысшие налоги
TaxesMax: |-
  Максимальный разрешенный уровень налогов.
  0 = наибольшие подачки
  11 = наивысшие налоги
Unknown011: Неиспользуемое значение.
Farm1: |-
  Ферма №1 в очереди строительства ИИ.

  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
Farm2: |-
  Ферма №2 в очереди строительства ИИ.

  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
Farm3: |-
  Ферма №3 в очереди строительства ИИ.

  Уничтоженная ферма заменяется не той же, а следующей по очереди разновидностью.
Farm4: |-
