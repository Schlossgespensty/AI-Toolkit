add_castle_message: |-
  Добавить этот замок в {{name}}?
  «Добавить в ИИ» скопирует замок в папку aiv этого ИИ и оставит проект открытым.
  «Редактировать отдельно» закроет проект ИИ и позволит сохранить замок в другом месте.
new_castle_message: |-
  Создать новый замок для {{name}}?
  «Добавить в ИИ» сохранит замок в папке aiv этого ИИ и оставит проект открытым.
  «Редактировать отдельно» закроет проект ИИ и позволит сохранить замок в другом месте.
replace_character_message: |-
  Использовать этого персонажа для {{name}}?
  «Добавить в ИИ» безвозвратно заменит текущий файл character.json этого ИИ.
  «Редактировать отдельно» закроет проект ИИ и сохранит его текущий файл персонажа.
new_character_message: |-
  Создать нового персонажа для {{name}}?
  «Добавить в ИИ» безвозвратно заменит текущий файл character.json этого ИИ.
  «Редактировать отдельно» закроет проект ИИ и сохранит его текущий файл персонажа.
add_document_message: Добавить этот документ в {{name}}? Добавление персонажа заменит существующий файл персонажа.
