reference_estimate_from_stronghold_heaven_original_stronghold_assuming_f: >-
  تخمین مرجع از Stronghold Heaven (بازی Stronghold اصلی)، با فرض تأمین کامل کارگران هم‌زمان با فراهم شدن مسکن.
  این نرخ‌های تقریبی زمان‌بندی تأییدشدهٔ شبیه‌سازی Crusader نیستند. تأخیر ساخت، مکث، کمبود مواد اولیه، مصرف،
  تجارت، محدودیت حمل‌ونقل و اثر ترس/استراحت محاسبه نمی‌شود. این کالاها موجودی انبار شما نیستند.
