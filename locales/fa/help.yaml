HarassingSiegeEnginesMax: حداکثر تعداد ادوات آزاردهنده‌ای که هم‌زمان در میدان حضور دارند.
RaidRetargetDelay: مدت انتظار نیروهای یورش کوچک پیش از انتخاب ساختمان هدف بعدی.
AttForceBase: >-
  تعداد نیروهایی که پیش از حمله به دشمن استخدام می‌شوند. پس از هر حمله طبق تنظیم UCP افزایش می‌یابد؛ در بازی
  اصلی هر بار ۵ نفر افزوده می‌شود.
AttForceRandom: >-
  تعداد نیروهایی که اگر هوش مصنوعی خود را قوی بداند و طلای زیادی داشته باشد، ممکن است به AttForceBase اضافه
  کند.
AttForceSupportAllyThreshold: تعداد نیروهای حمله که باید پیش از اجرای فرمان حمله/کمک بازیکن استخدام شده باشند.
AttForceRallyPercentage: درصد نیروهایی که باید در نقطهٔ تجمع حاضر شوند تا هوش مصنوعی حمله را آغاز کند.
Unknown129: >-
  اثر بسیار اندکی دارد. درصد نیروهایی که باید به محل تجمع برسند تا، اگر حمله برای آسیب زدن بیش از حد ضعیف
  تشخیص داده شد، عقب‌نشینی آغاز شود.

  همچنین درصد نیروهای در حال عقب‌نشینی که باید به ارگ برسند تا سربازگیری برای حملهٔ بعدی شروع شود.
AttAssaultDelay: مدت انتظار نیروهای حمله و ادوات در نقطهٔ تجمع، پس از آغاز حمله و پیش از اعزام به نبرد.
AttUnitPatrolRecommandDelay: >-
  مدت انتظار پیش از عقب‌نشینی پس از حملهٔ موفق. معمولاً بهتر است صفر باشد؛ دلیلی برای ماندن کنار قبر دشمن
  نیست.
Unknown132: >-
  درصد احتمال اینکه هوش مصنوعی برای حمله منتظر حملهٔ متحد بماند. در مراحل بعد ممکن است با حملهٔ متحد، برای
  همراهی با او حتی پیش از تکمیل سربازگیری حمله کند.
SiegeEngine1: ادوات محاصرهٔ شمارهٔ 1 که برای حمله ساخته می‌شود.
SiegeEngine2: ادوات محاصرهٔ شمارهٔ 2 که برای حمله ساخته می‌شود.
SiegeEngine3: ادوات محاصرهٔ شمارهٔ 3 که برای حمله ساخته می‌شود.
SiegeEngine4: ادوات محاصرهٔ شمارهٔ 4 که برای حمله ساخته می‌شود.
SiegeEngine5: ادوات محاصرهٔ شمارهٔ 5 که برای حمله ساخته می‌شود.
SiegeEngine6: ادوات محاصرهٔ شمارهٔ 6 که برای حمله ساخته می‌شود.
SiegeEngine7: ادوات محاصرهٔ شمارهٔ 7 که برای حمله ساخته می‌شود.
SiegeEngine8: ادوات محاصرهٔ شمارهٔ 8 که برای حمله ساخته می‌شود. حداکثر هشت ادوات حمله می‌توان داشت.
CowThrowInterval: تعداد سنگ‌هایی که منجنیق پیش از پرتاب یک گاو باید پرتاب کند.
Unknown142: این مقدار استفاده نمی‌شود.
AttMaxEngineers: >-
  حداکثر مهندسان برای به‌کارگیری ادوات جایگاه‌های SiegeEngine. دست‌کم باید برابر مجموع مهندسان لازم برای کار
  با آن ادوات باشد.
AttDiggingUnit: نوع نیرویی که در حمله خندق دشمن را پر می‌کند.
AttDiggingUnitMax: حداکثر حفاران استخدام‌شده در هر حمله.
AttUnitVanguard: نیرویی که پیش از بقیه برای حمله به قلعهٔ دشمن می‌دود.
AttUnitVanguardMax: حداکثر پیش‌قراولان استخدام‌شده در هر حمله.
AttMaxAssassins: حداکثر حشاشینی که هنگام محاصره از دروازه‌های دشمن بالا می‌روند.
AttMaxLaddermen: حداکثر نردبان‌دارانی که هنگام محاصره کنار دیوار نردبان می‌گذارند.
AttMaxTunnelers: حداکثر نقب‌زنانی که به سمت ارگ دشمن تونل می‌کنند.
AttUnitPatrol: نیروهایی که پیرامون قلعهٔ دشمن گشت می‌زنند و به نیروهای دشمن شلیک می‌کنند.
AttUnitPatrolMax: حداکثر نیروهای گشت استخدام‌شده در هر حمله.
AttUnitPatrolGroupsCount: تعداد گروه‌هایی که نیروهای گشت در آغاز حمله به آن تقسیم می‌شوند.
AttUnitBackup: >-
  نیروهایی که در نقطهٔ تجمع می‌مانند و فقط در صورت باز بودن مسیر ارگ دشمن حمله می‌کنند. اگر سایر مهاجمان کشته
  شوند، عقب‌نشینی می‌کنند.
AttUnitBackupMax: حداکثر نیروهای ذخیرهٔ استخدام‌شده در هر حمله.
AttUnitBackupGroupsCount: تعداد گروه‌های نیروهای ذخیره هنگام حمله به ارگ دشمن.
AttUnitEngage: نیروهایی که به‌جای دیوار به نیروها و روستاییان دشمن حمله می‌کنند.
AttUnitEngageMax: حداکثر نیروهای درگیری استخدام‌شده در هر حمله.
AttUnitSiegeDef: >-
  نیروهایی که هنگام حمله کنار ادوات محاصره می‌مانند. ممکن است علاوه بر ادوات حمله، کنار ادوات آزاردهنده یا
  دفاعی هم بمانند.
AttUnitSiegeDefMax: حداکثر محافظان ادوات استخدام‌شده در هر حمله.
AttUnitSiegeDefGroupsCount: تعداد گروه‌های محافظ ادوات در هنگام حمله.
AttUnitMain1: >-
  نوع نیروی شمارهٔ 1 در صف سربازگیری سپاه اصلی حمله.

  اگر هزینهٔ یک جایگاه تأمین نباشد، هوش مصنوعی سراغ جایگاه بعدی می‌رود. فقط تعداد این نیروها بدون سقف افزایش
  می‌یابد.
AttUnitMain2: >-
  نوع نیروی شمارهٔ 2 در صف سربازگیری سپاه اصلی حمله.

  اگر هزینهٔ یک جایگاه تأمین نباشد، هوش مصنوعی سراغ جایگاه بعدی می‌رود. فقط تعداد این نیروها بدون سقف افزایش
  می‌یابد.
AttUnitMain3: >-
  نوع نیروی شمارهٔ 3 در صف سربازگیری سپاه اصلی حمله.

  اگر هزینهٔ یک جایگاه تأمین نباشد، هوش مصنوعی سراغ جایگاه بعدی می‌رود. فقط تعداد این نیروها بدون سقف افزایش
  می‌یابد.
AttUnitMain4: >-
  نوع نیروی شمارهٔ 4 در صف سربازگیری سپاه اصلی حمله.

  اگر هزینهٔ یک جایگاه تأمین نباشد، هوش مصنوعی سراغ جایگاه بعدی می‌رود. فقط تعداد این نیروها بدون سقف افزایش
  می‌یابد. پس از این جایگاه، فهرست از ابتدا تکرار می‌شود.
AttMaxDefault: >-
  تعداد نیروهای سپاه اصلی که می‌توان پیش از تکمیل استخدام همهٔ نقش‌های تخصصی (نردبان‌دار، حشاشین، گشت و…)
  استخدام کرد.

  اگر صفر باشد، همهٔ نیروهای تخصصی باید پیش از هر نیروی AttUnitMain استخدام شوند.
AttMainGroupsCount: تعداد گروه‌هایی که نیروهای AttUnitMain هنگام حمله به آن تقسیم می‌شوند.
TargetChoice: |-
  روش انتخاب هدف حمله.
  طلا: دشمنی که بیشترین طلا را دارد.
  متعادل: انتخاب بر اساس امتیاز محاسبه‌شدهٔ ضعف؛ پیچیده‌ترین و دقیق‌ترین روش.
  نزدیک‌ترین: نزدیک‌ترین دشمن بر اساس فاصلهٔ ارگ‌ها.
  هر نوع: دشمن بعدی در فهرست داخلی بازیکنان؛ ممکن است تصادفی به نظر برسد اما ترتیب ثابتی دارد.
  بازیکن: ابتدا بازیکن انسانی؛ اگر دشمن انسانی نباشد، روش نزدیک‌ترین به کار می‌رود.
AIOxTethers_DisableInitialOxTether: «خیر» رفتار بازی اصلی است؛ «بله» از ساخت محل گاو در هر بار ساخت یا بازسازی معدن سنگ جلوگیری می‌کند.
AIOxTethers_Logic: "انتخاب منطق ساخت: «خیر» یعنی بازی اصلی و «بله» یعنی روش پویا."
AIOxTethers_MaxOxTethers: تعداد کل محل‌های گاو این هوش مصنوعی از این مقدار بیشتر نمی‌شود.
AIOxTethers_DynamicMaxOxTethers: تعداد کل محل‌های گاو از حاصل‌ضرب این مقدار در تعداد معادن سنگ بیشتر نمی‌شود.
AIOxTethers_MinimumOxTethersPerQuarry: >-
  اگر تعداد محل‌های گاو مرتبط که از این معدن سنگ می‌برند کمتر از این مقدار باشد، یک محل گاو دیگر برای معدن
  ساخته می‌شود.
AIOxTethers_MaximumOxTethersPerQuarry: اگر تعداد محل‌های گاو مرتبط با معدن بیشتر از این مقدار باشد، محل گاو دیگری برای آن ساخته نمی‌شود.
AIOxTethers_ThresholdStoneLoad: اگر نسبت «سنگ / محل‌های گاو مرتبط» در یک معدن از این مقدار بیشتر شود، محل گاو دیگری برای آن ساخته می‌شود.
RunningUnits_Macemen: >-
  اگر فعال باشد، این نیروها حتی در گروه نیروهای کندتر هم می‌دوند. اگر غیرفعال باشد، مانند بازی اصلی با سرعت
  کندترین عضو گروه حرکت می‌کنند.
RunningUnits_Spearmen: >-
  اگر فعال باشد، این نیروها حتی در گروه نیروهای کندتر هم می‌دوند. اگر غیرفعال باشد، مانند بازی اصلی با سرعت
  کندترین عضو گروه حرکت می‌کنند.
