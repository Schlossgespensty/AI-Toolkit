CriticalPopularity: |-
  زیر این سطح محبوبیت، هوش مصنوعی برای به دست آوردن طلا با شدت بیشتری کالا می‌فروشد.

  ۱۰۰۰۰ = محبوبیت ۱۰۰؛ ۵۰۰۰ = محبوبیت ۵۰.
LowestPopularity: >-
  زیر این سطح محبوبیت، مالیات به سمت TaxesMin کاهش می‌یابد و جیرهٔ اضافی داده می‌شود تا محبوبیت به
  HighestPopularity برسد.


  ۱۰۰۰۰ = محبوبیت ۱۰۰؛ ۵۰۰۰ = محبوبیت ۵۰.
HighestPopularity: |-
  بالاتر از این سطح محبوبیت، هوش مصنوعی مالیات را افزایش می‌دهد تا تغییر محبوبیت حداکثر ۳− و پایدار شود.

  ۱۰۰۰۰ = محبوبیت ۱۰۰؛ ۵۰۰۰ = محبوبیت ۵۰.
TaxesMin: |-
  کمترین سطح مجاز مالیات.
  ۰ = بیشترین پرداخت به مردم؛ ۱۱ = بیشترین مالیات.
TaxesMax: |-
  بیشترین سطح مجاز مالیات.
  ۰ = بیشترین پرداخت به مردم؛ ۱۱ = بیشترین مالیات.
