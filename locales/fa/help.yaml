HarassingSiegeEngine1: >-
  ادوات آزاردهندهٔ شمارهٔ 1 در صف ساخت. از انجمن مهندسان به سمت قلعهٔ دشمن می‌روند و در راه به ساختمان‌ها شلیک
  می‌کنند؛ بالستای آتشین به نیروها نیز شلیک می‌کند.
