DefWallPatrolRallyTime: >-
  مدتی که مدافعان دیوار پیش از رفتن به جایگاه بعدی AIV منتظر می‌مانند. همهٔ انواع مدافعان دیوار توان گشت‌زنی
  ندارند.
DefWallPatrolGroups: تعداد گروه‌های مدافع دیوار که میان جایگاه‌های AIV گشت می‌زنند.
DefSiegeEngineGoldThreshold: طلای لازم پیش از ساخت ادوات محاصرهٔ تعیین‌شده در AIV.
DefSiegeEngineBuildDelay: مدت انتظار پیش از بازسازی ادوات AIV نابودشده. مقدار کمتر یعنی انتظار کوتاه‌تر.
