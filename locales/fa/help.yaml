StrengthMultiplier: |-
  جان ارباب را در این عدد ضرب می‌کند.
  رت = ۰٫۵
  استاندارد = ۱
  ولف = ۱٫۵
DotColour: رنگ نقطه‌های نشان‌دهندهٔ قدرت ارباب. در بازی اصلی، هوش مصنوعی ضعیف زرد و قوی آبی است.
DotCount: تعداد نقطه‌های نشان‌دهندهٔ قدرت ارباب. در بازی اصلی هر نقطه معادل ۰٫۱ از ضریب قدرت است.
Type: نوع اربابی که روی ارگ ظاهر می‌شود.
ArabArcher: تعداد کماندار عرب که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Slave: تعداد برده که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Slinger: تعداد فلاخن‌انداز که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Assassin: تعداد حشاشین که ابتدای بازی کنار ارگ ظاهر می‌شوند.
HorseArcher: تعداد کماندار سواره که ابتدای بازی کنار ارگ ظاهر می‌شوند.
ArabSwordsman: تعداد شمشیرزن عرب که ابتدای بازی کنار ارگ ظاهر می‌شوند.
FireThrower: تعداد آتش‌انداز که ابتدای بازی کنار ارگ ظاهر می‌شوند.
EuropArcher: تعداد کماندار اروپایی که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Spearman: تعداد نیزه‌دار که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Maceman: تعداد گرزدار که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Crossbowman: تعداد کماندار زنبورکی که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Pikeman: تعداد نیزه‌دار زره‌پوش که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Swordsman: تعداد شمشیرزن که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Knight: تعداد شوالیه که ابتدای بازی کنار ارگ ظاهر می‌شوند.
Monk: تعداد راهب که ابتدای بازی کنار ارگ ظاهر می‌شوند.
WallDecoration: |-
  نوع تزئینی که با قرار دادن پرچم در ویرایشگر AIV نمایش داده می‌شود.

  ۸ = ریختن روغن شعله‌ور
  ۹ = شعله
  ۱۰ = پرچم کوچک
  ۱۱ = پرچم بزرگ
  ۱۲ = پرچم متوسط
  ۱۳ = پرچم صلیبی
  ۱۴ = آتشدان
  ۱۵ = جمجمهٔ تزئینی
  ۲۱ = ابر بخار
  ۲۲ = ابر بیماری
  ۲۶ = انفجار آتش
  ۲۸ = فرود کلاغ‌ها
  ۲۹ = افتادن سنگ متوسط در آب
  ۳۰ = برخورد سنگ کوچک با ساختمان
  ۳۱ = افتادن سنگ کوچک در آب
  ۴۰ = نوشتهٔ شناور طلای صفر
  ۴۱ = نوشتهٔ شناور محبوبیت صفر
  ۴۲ = نوشتهٔ شناور خالی
  ۴۳ = نوشتهٔ شناور خالی
