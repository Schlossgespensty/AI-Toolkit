AIVTroops_InitialRole: >-
  نقش آغازین نیروهای شروع بازی یا سناریو که هنوز مأموریت ندارند. حفاری فقط با توان واقعی حفاری و وجود خانه‌های
  خندق انجام می‌شود؛ در غیر این صورت دفاع انتخاب می‌شود.


  پیش‌فرض مشترک همهٔ نیروهای پشتیبانی‌شده. انتخاب «اصلی» این پارامتر را در شخصیت ذخیره نمی‌کند و پیش‌فرض عمومی
  یا منوی بعدی اعمال می‌شود. افزونهٔ aiv-troops-behaviour با گزینه‌های Troop settings و Use AIC overrides باید
  فعال باشد. پس از تغییر، UCP را دوباره راه‌اندازی کرده و بازی تازه‌ای آغاز کنید.
AIVTroops_Movement: >-
  حرکت مدافعان در جایگاه‌های AIV. گشت‌زنی از DefWallPatrolGroups و DefWallPatrolRallyTime استفاده می‌کند؛ با
  صفر گروه، نیروها ثابت می‌مانند.


  پیش‌فرض مشترک همهٔ نیروهای پشتیبانی‌شده. انتخاب «اصلی» این پارامتر را در شخصیت ذخیره نمی‌کند و پیش‌فرض عمومی
