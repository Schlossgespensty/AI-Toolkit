DefTotal: تعداد کل نیروهای دفاعی که هوش مصنوعی استخدام می‌کند.
OuterPatrolGroupsCount: تعداد گروه‌های مدافع که پیرامون ساختمان‌های اقتصادی گشت می‌زنند.
OuterPatrolGroupsMove: تعیین می‌کند مدافعان غیر از مدافعان دیوار، پیرامون اقتصاد گشت بزنند یا ثابت بمانند (اغلب کنار معادن سنگ).
OuterPatrolRallyDelay: مدت انتظار مدافعان غیر از مدافعان دیوار پیش از رفتن به محل بعدی.
DefWalls: >-
  تعداد نیروهای دفاعی اختصاص‌یافته به دیوار. آن‌ها به جایگاه‌های AIV در قلعه می‌روند؛ بقیه از اقتصاد محافظت
  می‌کنند.
DefUnit1: |-
  نوع نیروی شمارهٔ 1 در صف سربازگیری دفاع.
  اگر هزینهٔ یک جایگاه تأمین نباشد، هوش مصنوعی سراغ جایگاه بعدی می‌رود.
