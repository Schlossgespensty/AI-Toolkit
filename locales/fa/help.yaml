RecruitProbDefDefault: |-
  احتمال سربازگیری نیروهای دفاعی در وضعیت عادی.

  ضعیف: بسیار نادر، اغلب نزدیک شکست.
  عادی: معمولاً سال‌های اول بازی.
  قوی: رایج‌ترین وضعیت؛ اغلب وقتی جمعیت و تعداد نیروها از ۴۰ بیشتر شوند به آن می‌رسد.
RecruitProbDefWeak: |-
  احتمال سربازگیری نیروهای دفاعی در وضعیت ضعیف.

  ضعیف: بسیار نادر، اغلب نزدیک شکست.
  عادی: معمولاً سال‌های اول بازی.
  قوی: رایج‌ترین وضعیت؛ اغلب وقتی جمعیت و تعداد نیروها از ۴۰ بیشتر شوند به آن می‌رسد.
RecruitProbDefStrong: |-
