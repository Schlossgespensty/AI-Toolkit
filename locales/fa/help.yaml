Farm1: |-
  نوع مزرعهٔ شمارهٔ 1 در ترتیب ساخت هوش مصنوعی.

  مزرعهٔ ویران‌شده الزاماً با همان نوع جایگزین نمی‌شود؛ نوع بعدی صف ساخته خواهد شد.
