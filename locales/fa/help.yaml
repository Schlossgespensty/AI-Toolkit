Farm8: |-
  نوع مزرعهٔ شمارهٔ 8 در ترتیب ساخت هوش مصنوعی. پس از Farm8، صف از ابتدا تکرار می‌شود.

  مزرعهٔ ویران‌شده الزاماً با همان نوع جایگزین نمی‌شود؛ نوع بعدی صف ساخته خواهد شد.
PopulationPerFarm: |-
  به‌ازای این تعداد ظرفیت جمعیت، یک مزرعه ساخته می‌شود. مزرعهٔ اول همیشه در جمعیت صفر ساخته می‌شود.
  مزارع رازک در این محاسبه نیستند و هر زمان نوبتشان در صف برسد ساخته می‌شوند.
PopulationPerWoodcutter: >-
  به‌ازای این تعداد ظرفیت جمعیت، یک چوب‌بری ساخته می‌شود. هنگام رسیدن به اولین آستانه، به‌جای یکی دو مورد
  ساخته می‌شود.
PopulationPerQuarry: >-
  به‌ازای این تعداد ظرفیت جمعیت، یک معدن سنگ ساخته می‌شود. هنگام رسیدن به اولین آستانه، به‌جای یکی دو مورد
  ساخته می‌شود.
PopulationPerIronmine: >-
  به‌ازای این تعداد ظرفیت جمعیت، یک معدن آهن ساخته می‌شود. هنگام رسیدن به اولین آستانه، به‌جای یکی دو مورد
  ساخته می‌شود.
PopulationPerPitchrig: به‌ازای این تعداد ظرفیت جمعیت، یک چاه قیر ساخته می‌شود.
MaxQuarries: حداکثر تعداد معدن سنگ که هوش مصنوعی می‌سازد.
MaxIronmines: حداکثر تعداد معدن آهن که هوش مصنوعی می‌سازد.
MaxWoodcutters: حداکثر تعداد چوب‌بری که هوش مصنوعی می‌سازد.
MaxPitchrigs: حداکثر تعداد چاه قیر که هوش مصنوعی می‌سازد.
MaxFarms: حداکثر تعداد مزارعی که هوش مصنوعی می‌سازد. مزارع رازک در این سقف محاسبه نمی‌شوند.
BuildInterval: >-
  سرعت ساخت هوش مصنوعی را تعیین می‌کند؛ برای ساختمان‌های AIV، ساختمان‌های خارج AIV و همهٔ تعمیرها اعمال
  می‌شود.

  ۱ سریع‌ترین حالت است.
ResourceRebuildDelay: مدتی که هوش مصنوعی پیش از تلاش برای بازسازی یک ساختمان منابع خارج از AIV منتظر می‌ماند.
MaxFood: |-
  حداکثر ذخیرهٔ سیب، پنیر، گوشت، نان و گندم؛ ResourceVariance نیز به سقف اضافه می‌شود.
  این مقدار برای هر نوع جداگانه است، نه مجموع آن‌ها.
MinimumApples: >-
  اگر ذخیرهٔ سیب کمتر از این مقدار باشد، هر بار به اندازهٔ TradeAmountFood خرید می‌شود تا دوباره به این حد
  برسد.

  صفر یعنی هرگز سیب خریداری نمی‌شود.
MinimumCheese: >-
  اگر ذخیرهٔ پنیر کمتر از این مقدار باشد، هر بار به اندازهٔ TradeAmountFood خرید می‌شود تا دوباره به این حد
  برسد.

  صفر یعنی هرگز پنیر خریداری نمی‌شود.
MinimumBread: >-
  اگر ذخیرهٔ نان کمتر از این مقدار باشد، هر بار به اندازهٔ TradeAmountFood خرید می‌شود تا دوباره به این حد
  برسد.

  صفر یعنی هرگز نان خریداری نمی‌شود.

  در اقتصاد متکی به نان، ممکن است بهتر باشد این مقدار صفر بماند و به‌جای نان گندم خریده شود.
MinimumWheat: >-
  اگر ذخیرهٔ گندم کمتر از این مقدار باشد، هر بار به اندازهٔ TradeAmountFood خرید می‌شود تا دوباره به این حد
  برسد.

  صفر یعنی هرگز گندم خریداری نمی‌شود.
MinimumHop: >-
  اگر ذخیرهٔ رازک کمتر از این مقدار باشد، هر بار به اندازهٔ TradeAmountFood خرید می‌شود تا دوباره به این حد
  برسد.

  صفر یعنی هرگز رازک خریداری نمی‌شود.
TradeAmountFood: >-
  مقدار غذایی که در هر نوبت خریده می‌شود. هوش مصنوعی هر بار فقط یک نوع غذا می‌خرد.

  مقدار کمتر، خرید ارزان‌تر و محتمل‌تری دارد اما ممکن است به دفعات بیشتری نیاز باشد؛ در نتیجه تأمین ذخیره
  کندتر و کمبود کوتاه‌مدت محتمل می‌شود.
TradeAmountEquipment: >-
  مقدار تجهیزات خریداری‌شده در هر نوبت. هوش مصنوعی هر بار فقط یک نوع تجهیزات می‌خرد.

  مقدار کمتر، خرید ارزان‌تر و محتمل‌تری دارد اما ممکن است به دفعات بیشتری نیاز باشد؛ در نتیجه تأمین سلاح کندتر
  و کمبود کوتاه‌مدت محتمل می‌شود.
AIRequestDelay: فاصلهٔ درخواست منابع از بازیکن. مقدار کمتر یعنی درخواست‌های بیشتر.
MinimumGoodsRequiredAfterTrade: >-
  حداقل مقداری از هر منبع که باید پس از معامله با بازیکن باقی بماند تا هوش مصنوعی معامله را بپذیرد. در غیر این
  صورت درخواست رد می‌شود.
DoubleRationsFoodThreshold: اگر مجموع سیب، پنیر، گوشت و نان از این مقدار بیشتر باشد، هوش مصنوعی جیرهٔ دوبرابر می‌دهد.
MaxWood: حداکثر ذخیرهٔ چوب؛ ResourceVariance نیز به این سقف افزوده می‌شود.
MaxStone: حداکثر ذخیرهٔ سنگ؛ ResourceVariance نیز به این سقف افزوده می‌شود.
MaxResourceOther: |-
  حداکثر ذخیرهٔ آهن، قیر، رازک و آرد؛ ResourceVariance نیز به سقف اضافه می‌شود.
  این مقدار برای هر نوع جداگانه است، نه مجموع آن‌ها.
MaxEquipment: |-
  حداکثر ذخیرهٔ سلاح و زره؛ ResourceVariance نیز به سقف اضافه می‌شود.
  این مقدار برای هر نوع جداگانه است، نه مجموع آن‌ها.
MaxBeer: حداکثر ذخیرهٔ آبجو؛ ResourceVariance نیز به این سقف افزوده می‌شود.
MaxResourceVariance: مقدار انحراف مجاز از هر یک از سقف‌های Max[Resource].
RecruitGoldThreshold: حداقل طلایی که هوش مصنوعی باید داشته باشد تا سربازگیری را آغاز کند.
BlacksmithSetting: >-
  محصول آهنگری‌ها را تعیین می‌کند. با انتخاب «هر دو»، آهنگری اول شمشیر، دومی گرز، سومی شمشیر و به همین ترتیب
  تولید می‌کند.
FletcherSetting: >-
  محصول کمان‌سازی‌ها را تعیین می‌کند. با انتخاب «هر دو»، کارگاه اول کمان، دومی کمان زنبورکی، سومی کمان و به
  همین ترتیب تولید می‌کند.
PoleturnerSetting: >-
  محصول نیزه‌سازی‌ها را تعیین می‌کند. با انتخاب «هر دو»، کارگاه اول نیزه، دومی نیزهٔ بلند، سومی نیزه و به همین
  ترتیب تولید می‌کند.
