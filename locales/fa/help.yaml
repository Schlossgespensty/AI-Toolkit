SortieUnitRangedMin: |-
  حداقل تعداد تیراندازانی که برای یورش دفاعی اعزام می‌شوند.

  ضعیف: بسیار نادر، اغلب نزدیک شکست.
  عادی: معمولاً سال‌های اول بازی.
  قوی: رایج‌ترین وضعیت؛ اغلب وقتی جمعیت و تعداد نیروها از ۴۰ بیشتر شوند به آن می‌رسد.
SortieUnitRanged: >-
  نوع تیراندازانی که برای دفاع بیرون قلعه اعزام می‌شوند. آن‌ها در محل کشته شدن کارگران مستقر می‌شوند. با کشته
  شدن مکررشان، تعدادشان افزایش می‌یابد و معمولاً در ادامهٔ بازی حدود ۲۵ نفر بیشتر از مقدار تعیین‌شده جذب
  می‌شوند.

  حتی با مقدار صفر هم جذب می‌شوند؛ برای غیرفعال کردن، نوعی غیرقابل‌استخدام انتخاب کنید. سربازگیری این نیروها
  بر همهٔ نیروهای دیگر اولویت دارد.
SortieUnitMeleeMin: تعداد دقیق نیروهای نزدیک‌زنی که برای یورش دفاعی اعزام می‌شوند.
SortieUnitMelee: >-
  نوع نیروهایی که برای مقابله با مهاجمان تخریب‌کنندهٔ ساختمان اعزام می‌شوند. پس از مرگ هدف به بالای ارگ
  برمی‌گردند. سربازگیری آن‌ها بر همهٔ نیروهای دیگر اولویت دارد.
DefDiggingUnitMax: >-
  حداکثر حفاران استخدام‌شده. تا زمانی که هوش مصنوعی یا متحدش خندق برنامه‌ریزی‌شده داشته باشد، سربازگیری حفاران
  بر نیروهای دفاع، یورش کوچک و حمله اولویت دارد.
DefDiggingUnit: نوع نیرویی که خندق دفاعی خود یا متحد را می‌کند.
RecruitInterval: |-
  مدت انتظار پیش از سربازگیری نیروی بعدی در وضعیت عادی. مقدار ۱ سریع‌ترین حالت است.

  ضعیف: بسیار نادر، اغلب نزدیک شکست.
  عادی: معمولاً سال‌های اول بازی.
  قوی: رایج‌ترین وضعیت؛ اغلب وقتی جمعیت و تعداد نیروها از ۴۰ بیشتر شوند به آن می‌رسد.
