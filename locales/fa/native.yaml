add_castle_message: |-
  این قلعه به {{name}} افزوده شود؟
  «افزودن به هوش مصنوعی» قلعه را در پوشهٔ aiv آن هوش مصنوعی کپی می‌کند و پروژه را باز نگه می‌دارد.
  «ویرایش جداگانه» از پروژهٔ هوش مصنوعی خارج می‌شود تا بتوانید قلعه را در محل دیگری ذخیره کنید.
new_castle_message: |-
  قلعهٔ جدیدی برای {{name}} ساخته شود؟
  «افزودن به هوش مصنوعی» قلعه را در پوشهٔ aiv آن هوش مصنوعی ذخیره می‌کند و پروژه را باز نگه می‌دارد.
  «ویرایش جداگانه» از پروژهٔ هوش مصنوعی خارج می‌شود تا بتوانید قلعه را در محل دیگری ذخیره کنید.
replace_character_message: |-
  از این شخصیت برای {{name}} استفاده شود؟
  «افزودن به هوش مصنوعی» پروندهٔ فعلی character.json آن هوش مصنوعی را برای همیشه جایگزین می‌کند.
  «ویرایش جداگانه» از پروژهٔ هوش مصنوعی خارج می‌شود و پروندهٔ شخصیت فعلی آن را نگه می‌دارد.
new_character_message: |-
  شخصیت جدیدی برای {{name}} ساخته شود؟
  «افزودن به هوش مصنوعی» پروندهٔ فعلی character.json آن هوش مصنوعی را برای همیشه جایگزین می‌کند.
  «ویرایش جداگانه» از پروژهٔ هوش مصنوعی خارج می‌شود و پروندهٔ شخصیت فعلی آن را نگه می‌دارد.
