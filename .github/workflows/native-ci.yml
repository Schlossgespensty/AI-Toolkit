name: Native CI

on:
  push:
    # Fork preview branches are checked by their upstream pull request.
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared editor checks
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - name: Validate translations, package policy and native bridge types
        run: |
          npm run check:locales
          node scripts/package-policy.mjs
          npx tsc --project tsconfig.desktop.json --noEmit
      - name: Check shared editor syntax and behavior
        run: npm run check
      - name: Render the shared editor in the existing smoke-test host
        run: npx electron scripts/render-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-check
          path: artifacts/render
          if-no-files-found: ignore
          retention-days: 14

  check:
    name: Native (${{ matrix.os }})
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # The shared job owns renderer checks. Native compilation needs the npm
      # dependencies, but never the downloaded Chromium executable.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - name: Install Linux WebKit build dependencies
        if: runner.os == 'Linux'
        # https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install stable Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: native-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: native-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
      - run: npm ci
      - name: Build the embedded frontend
        run: node scripts/build-desktop.mjs
      - name: Check Rust formatting
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test native logic and generated IPC contracts
        # The game parity fixture remains opt-in: no copyrighted game data or
        # game executable is downloaded, started or accessed by this workflow.
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Compile the native application
        run: cargo build --locked --bins --manifest-path src-tauri/Cargo.toml
