name: CI

on:
  push:
    # Preview packaging already runs npm run check on its Windows runner.
    branches-ignore:
      - 'build/castle-controls-preview'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run check
