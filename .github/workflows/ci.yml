name: CI

on:
  push:
    # Preview packaging already runs npm run check on its Windows runner.
    branches-ignore:
      - 'build/castle-controls-preview'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx electron scripts/render-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-check
          path: artifacts/render
          if-no-files-found: ignore
          retention-days: 14
